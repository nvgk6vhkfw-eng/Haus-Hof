<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171615"><title>Haus & Hof</title>
<style>
:root{--bg:#141414;--panel:#242322;--panel2:#302d2b;--text:#f7f2ed;--muted:#b9aaa0;--accent:#c98860;--line:#4b403a;--good:#8ebd9c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:var(--accent);color:#17110e;padding:11px 15px;font-weight:700}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.small{padding:7px 10px;font-size:13px}button.danger{background:#8d4b46;color:white}input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text)}textarea{min-height:90px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}.wrap{max-width:980px;margin:auto;padding:18px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:28px;margin:0;letter-spacing:-1px}h2{font-size:23px;margin:0 0 14px}h3{font-size:17px;margin:0 0 8px}.sub,.muted{color:var(--muted)}.sub{font-size:13px;margin-top:3px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:18px;margin:12px 0;box-shadow:0 4px 20px #0002}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:142px;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.tile .emoji{font-size:28px}.tile strong{font-size:17px}.tile small{color:var(--muted);font-weight:400}.topactions{display:flex;gap:8px;align-items:center}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}.stack{display:grid;gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.item.done{opacity:.6}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{display:inline-block;background:var(--panel2);padding:6px 10px;border-radius:100px;color:var(--muted);font-size:12px}.hidden{display:none!important}.notice{border-left:3px solid var(--accent);padding:12px;background:var(--panel);border-radius:9px;margin:12px 0}.error{color:#ffaaa0}.ok{color:var(--good)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{margin-top:0}.back{margin-bottom:18px}.foot{color:var(--muted);font-size:12px;margin-top:30px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.check{width:20px;height:20px;accent-color:var(--accent)}.auth{max-width:420px;margin:7vh auto}.spacer{height:8px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4b3228;color:white;padding:12px 20px;border-radius:14px;z-index:5;max-width:90%;display:none} @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.tile{min-height:180px}}@media(max-width:420px){h1{font-size:25px}.wrap{padding:14px 12px 90px}.tile{padding:14px;min-height:133px}.tile strong{font-size:15px}.formgrid{grid-template-columns:1fr}}

/* V1.2: kompakte, gemeinsame Tagesübersicht */
.today-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px 15px;margin:12px 0 18px}
.today-line{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;background:transparent;color:var(--text);border:0;border-radius:0;text-align:left;font-weight:400}
.today-line+.today-line{border-top:1px solid var(--line)}
.today-icon{font-size:19px;width:26px;flex:none;text-align:center}.today-content{min-width:0;flex:1}.today-label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.today-value{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.today-meta{font-size:12px;color:var(--muted)}.today-arrow{color:var(--accent);font-size:20px}.today-heading{font-size:14px;font-weight:700;color:var(--accent);margin:20px 0 8px}

/* V1.3: platzsparende Startseite */
header{margin-bottom:12px}header h1{font-size:25px}header .sub{font-size:11px;margin-top:1px}
.home-greeting{font-size:13px;margin:4px 0 10px}
.today-card{padding:3px 12px;margin:8px 0 13px;border-radius:14px}
.today-line{padding:9px 1px;gap:9px;min-height:51px}
.today-icon{font-size:16px;width:21px;color:var(--accent)}
.today-content{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.today-label{font-size:12px;font-weight:600;color:var(--muted);width:65px;flex:none;margin:0}
.today-value{font-size:13px;font-weight:600;min-width:0;flex:1;white-space:nowrap}
.today-meta{font-size:11px;color:var(--muted);margin:0;white-space:nowrap}
.today-arrow{font-size:16px}
.today-heading{margin:12px 0 8px;font-size:15px}
.home-tiles{gap:9px}
.home-tiles .tile{min-height:75px;padding:11px 12px;border-radius:13px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px}
.home-tiles .tile .emoji{font-size:21px;flex:none}
.home-tiles .tile strong{font-size:13px;line-height:1.3}
.home-tiles .tile small{display:none}
.version-label{font-size:11px;color:var(--muted);text-align:left;opacity:.75;margin-top:24px}
@media(min-width:700px){.home-tiles .tile{min-height:86px}}
@media(max-width:420px){.home-tiles .tile{min-height:69px;padding:9px}.home-tiles .tile strong{font-size:12px}.today-meta{font-size:10px}.today-label{width:55px;font-size:11px}}

/* V1.4: mobile form layout and native iOS date input containment */
.card,.item,.formgrid,.formgrid>div,form,form>div{min-width:0;max-width:100%}
input,textarea,select{display:block;min-width:0;max-width:100%}
input[type="date"],input[type="datetime-local"]{width:100%;min-width:0;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;color-scheme:dark}
input[type="date"]::-webkit-date-and-time-value,input[type="datetime-local"]::-webkit-date-and-time-value{min-width:0;text-align:left}
input[type="date"]::-webkit-datetime-edit,input[type="datetime-local"]::-webkit-datetime-edit{min-width:0}
.card textarea{min-height:68px;height:76px;resize:vertical}
@media(max-width:600px){.formgrid{grid-template-columns:minmax(0,1fr)}.card{padding:15px}.card label{margin-top:10px}}

/* V1.5: kompakte Aufgabenverwaltung */
.task-meta{font-size:12px;margin-top:7px}.item p{margin:8px 0}.row h2{margin-bottom:0}.repeat-count{margin-top:7px}
.home-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.tile{position:relative}.tile-count{position:absolute;top:5px;right:7px;min-width:18px;padding:1px 5px;border-radius:12px;background:var(--accent);color:var(--bg);font-size:11px;font-weight:700}.tile-count:empty{display:none}@media(min-width:700px){.home-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:1000px){.home-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><div id="app" class="wrap"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const themes={black_copper:['#141414','#242322','#302d2b','#f7f2ed','#b9aaa0','#c98860','#4b403a'],forest_bronze:['#17231d','#263a30','#344a3d','#f5f1e8','#b9c4b6','#c59b62','#4d6052'],anthracite_petrol:['#172125','#26363b','#30484c','#f2f7f7','#afc3c5','#61b6b5','#466064'],anthracite_pink:['#202024','#303037','#403842','#fff5fa','#c5b3c0','#e3a1bb','#594650'],berry_rose:['#281b26','#3d2938','#513745','#fff4f7','#d4b8c7','#dda5a8','#684857'],navy_gold:['#141e2f','#223149','#2d4059','#f7f5ee','#b9c2ce','#d5b36b','#485975'],anthracite_sand:['#222321','#32332f','#41423a','#f5f3eb','#c7c4b5','#c8b894','#57594f']};
const themeNames={black_copper:'Schwarz & Kupfer',forest_bronze:'Waldgrün & Bronze',anthracite_petrol:'Anthrazit & Petrol',anthracite_pink:'Anthrazit & Pink',berry_rose:'Beere & Roségold',navy_gold:'Dunkelblau & Gold',anthracite_sand:'Anthrazit & Natursand'};
const modules=[['recipes','🍲','Rezepte & Wochenplan','Gerichte und Einkaufsliste'],['ideas','💡','Unsere Ideen','Gemeinsam sammeln'],['shopping','🛒','Einkaufslisten','Gemeinsam einkaufen'],['tasks','🏠','Haushalt','Aufgaben im Haus'],['yard','🌿','Hof & Reparaturen','Alles rund ums Grundstück'],['assets','🚗','Fahrzeuge & Geräte','TÜV und Fälligkeiten'],['calendar','📅','Kalender','Gemeinsame Termine']];
let client=null,user=null,household=null,memberNames={},prefs={theme:'black_copper',tile_layout:[],push_preferences:{}},page='home',editing=null,cache={};
function formatDateDE(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return value||'';let [y,m,d]=value.split('-');return `${d}.${m}.${y}`}
function toast(t){let el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>el.style.display='none',3500)}
function applyTheme(t){let a=themes[t]||themes.black_copper;['bg','panel','panel2','text','muted','accent','line'].forEach((n,i)=>document.documentElement.style.setProperty('--'+n,a[i]));document.querySelector('meta[name="theme-color"]').content=a[0]}
function header(){return `<header><div><h1>Haus <span style="color:var(--accent)">&</span> Hof</h1><div class="sub">Unser Zuhause. Gemeinsam organisiert.</div></div><div class="topactions">${user?`<button class="secondary small" onclick="go('settings')" aria-label="Einstellungen">⚙️</button>`:''}</div></header>`}
function render(content){$('#app').innerHTML=header()+content+`<div class="foot">Version 1.6 · Haus & Hof</div>`}
function back(){return `<button class="secondary small back" onclick="go('home')">← Übersicht</button>`}
function config(){let url='https://fvwykztdwwbloweotlbd.supabase.co',key='sb_publishable_ARFAEa5Hwedfx6ftRPpz1A__TJ8aHvf';return {url,key}}
function initClient(){let {url,key}=config();if(!url||!key)return false;try{client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});return true}catch(e){toast('Verbindungseinstellungen prüfen');return false}}
function setup(){let {url,key}=config();render(`<div class="card auth"><h2>Verbindung einrichten</h2><p class="muted">Einmalig die Supabase-Projektadresse und den <b>öffentlichen</b> Publishable- bzw. anon-Schlüssel eintragen. Keinen geheimen service_role-Schlüssel verwenden.</p><label>Project URL</label><input id="url" type="url" placeholder="https://xxxxx.supabase.co" value="${esc(url)}"><label>Publishable / anon key</label><textarea id="key" placeholder="sb_publishable_… oder eyJ…">${esc(key)}</textarea><div class="spacer"></div><button onclick="saveConfig()">Verbindung speichern</button><p class="muted">Die Angaben bleiben auf diesem Gerät gespeichert. Für Janas Gerät später einmal wiederholen.</p></div>`)}
function saveConfig(){let url=$('#url').value.trim(),key=$('#key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)||!key){toast('Bitte gültige Project URL und öffentlichen Schlüssel eingeben');return}localStorage.setItem('hh_url',url.replace(/\/$/,''));localStorage.setItem('hh_key',key);location.reload()}
function login(){render(`<div class="card auth"><h2>Willkommen zuhause</h2><p class="muted">Melde dich mit deinem eigenen Haus-&-Hof-Konto an.</p><form onsubmit="signIn(event)"><label>E-Mail-Adresse</label><input id="email" type="email" autocomplete="username" required><label>Passwort</label><input id="password" type="password" autocomplete="current-password" required><div class="spacer"></div><button type="submit">Anmelden</button></form><p class="muted">Die Konten wurden bereits in Supabase angelegt.</p><button class="secondary small" onclick="setup()">Verbindungseinstellungen</button></div>`)}
async function signIn(e){e.preventDefault();let {error}=await client.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){toast('Anmeldung fehlgeschlagen: '+error.message);return}await start()}
async function signOut(){await client.auth.signOut();user=null;household=null;login()}
async function start(){let {data:{user:u}}=await client.auth.getUser();user=u;if(!user){login();return}let {data,error}=await client.from('household_members').select('household_id,display_name,user_id').eq('user_id',user.id).limit(1);if(error||!data?.length){render(`<div class="notice">Dein Konto ist angemeldet, aber noch keinem Haushalt zugeordnet. Bitte die Supabase-Mitgliedschaft prüfen.</div><button onclick="signOut()">Abmelden</button>`);return}household=data[0].household_id;let m=await client.from('household_members').select('user_id,display_name').eq('household_id',household);memberNames=Object.fromEntries((m.data||[]).map(x=>[x.user_id,x.display_name]));let p=await client.from('user_preferences').select('*').eq('user_id',user.id).maybeSingle();prefs={theme:'black_copper',tile_layout:[],push_preferences:{},...(p.data||{})};applyTheme(prefs.theme);go('home')}
async function savePrefs(){let {error}=await client.from('user_preferences').upsert({user_id:user.id,theme:prefs.theme,tile_layout:prefs.tile_layout,push_preferences:prefs.push_preferences});if(error)toast(error.message)}
function go(p){page=p;editing=null;if(p==='home')home();else if(p==='settings')settings();else if(p==='tasks'||p==='yard')tasks(p);else if(p==='recipes'||p==='shopping')recipes();else if(p==='ideas')ideas();else if(p==='assets')assets();else if(p==='calendar')calendar()}
async function home(){
 const thisHousehold=household;
 const order=Array.isArray(prefs.tile_layout)&&prefs.tile_layout.length?prefs.tile_layout:modules.map(m=>m[0]);
 const ordered=[...modules].sort((a,b)=>(order.includes(a[0])?order.indexOf(a[0]):100+modules.findIndex(m=>m[0]===a[0]))-(order.includes(b[0])?order.indexOf(b[0]):100+modules.findIndex(m=>m[0]===b[0])));
 const today=new Date().toLocaleDateString('en-CA');
 const now=new Date().toISOString();
 const [tasksResult,eventsResult,mealResult,maintenanceResult,allTasksResult,wasteResult]=await Promise.all([
  client.from('tasks').select('title,due_date,category,completed_at').eq('household_id',thisHousehold).is('completed_at',null).not('due_date','is',null).order('due_date',{ascending:true}).limit(1),
  client.from('calendar_events').select('title,starts_at').eq('household_id',thisHousehold).gte('starts_at',now).order('starts_at',{ascending:true}).limit(1),
  client.from('meal_plan').select('recipe_id,portions').eq('household_id',thisHousehold).eq('meal_date',today).maybeSingle(),
  client.from('maintenance').select('title,due_date').eq('household_id',thisHousehold).gte('due_date',today).order('due_date').limit(1),
  client.from('tasks').select('category,completed_at').eq('household_id',thisHousehold).is('completed_at',null),
  client.from('calendar_events').select('title,starts_at').eq('household_id',thisHousehold).gte('starts_at',now).like('apple_event_uid','wbc-%').order('starts_at').limit(1)
 ]);
 if(page!=='home'||household!==thisHousehold)return;
 let task=tasksResult.data?.[0],event=eventsResult.data?.[0],meal=mealResult.data,mealTitle=null;
 if(meal?.recipe_id){let r=await client.from('recipes').select('title').eq('household_id',thisHousehold).eq('id',meal.recipe_id).maybeSingle();mealTitle=r.data?.title||null}
 if(page!=='home'||household!==thisHousehold)return;
 const dateLabel=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
 const taskDate=task?.due_date?new Date(task.due_date+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):'';
 const eventDate=event?new Date(event.starts_at).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
 const line=(icon,label,value,meta,target)=>`<button class="today-line" onclick="go('${target}')"><span class="today-icon">${icon}</span><span class="today-content"><span class="today-label">${label}</span><span class="today-value">${esc(value)}</span>${meta?`<span class="today-meta">${esc(meta)}</span>`:''}</span><span class="today-arrow">›</span></button>`;
 const overview=`<div class="today-card">${line('✓','Nächste Aufgabe',task?.title||'Keine fälligen Aufgaben',task?(task.due_date<today?'Überfällig · ':task.due_date===today?'Heute · ':'Fällig am ')+taskDate:'',task?.category==='hof'?'yard':'tasks')}${line('▦','Nächster Termin',event?.title||'Kein anstehender Termin',eventDate,'calendar')}${line('♨','Heute gibt es',mealTitle||'Noch kein Essen geplant',mealTitle?meal.portions+' Portionen':'','recipes')}${maintenanceResult.data?.[0]?line('🔧','Nächste Wartung',maintenanceResult.data[0].title,formatDateDE(maintenanceResult.data[0].due_date),'assets'):''}${wasteResult.data?.[0]?line('🗑','Nächste Müllabfuhr',wasteResult.data[0].title,new Date(wasteResult.data[0].starts_at).toLocaleDateString('de-DE'),'calendar'):''}</div>`;
 render(`<p class="muted home-greeting">Hallo ${esc(memberNames[user.id]||'ihr zwei')} 👋 · ${esc(dateLabel)}</p>${overview}<div class="today-heading">Unsere Bereiche</div><div class="grid home-tiles">${ordered.map(m=>`<button class="tile" onclick="go('${m[0]}')"><span class="emoji">${m[1]}</span><span><strong>${m[2]}</strong><br><small>${m[3]}</small>${['tasks','yard'].includes(m[0])?`<span class="tile-count" onclick="event.stopPropagation();go('${m[0]}')">${(allTasksResult.data||[]).filter(t=>t.category===(m[0]==='yard'?'hof':'haushalt')).length||''}</span>`:''}</span></button>`).join('')}</div>`);
 if(tasksResult.error||eventsResult.error||mealResult.error)toast('Tagesübersicht konnte teilweise nicht geladen werden');
}
function settings(){render(back()+`<h2>Einstellungen</h2><div class="card"><h3>Mein Design</h3><label>Farbthema</label><select id="theme" onchange="changeTheme(this.value)">${Object.entries(themeNames).map(([k,v])=>`<option value="${k}" ${prefs.theme===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="card"><h3>Meine Kacheln</h3><p class="muted">Reihenfolge mit den Pfeilen ändern.</p><div class="stack">${[...new Set([...(prefs.tile_layout?.length?prefs.tile_layout:modules.map(x=>x[0])),...modules.map(x=>x[0])])].map((id,i)=>{let m=modules.find(x=>x[0]===id);return m?`<div class="row item"><span>${m[1]} ${m[2]}</span><span><button class="small secondary" onclick="moveTile(${i},-1)">↑</button> <button class="small secondary" onclick="moveTile(${i},1)">↓</button></span></div>`:''}).join('')}</div></div><div class="card"><h3>Erinnerungen</h3><label class="row" style="align-items:center;gap:12px"><input type="checkbox" style="width:auto" ${prefs.push_preferences?.muell!==false?'checked':''} onchange="setWasteReminder(this.checked)"><span>Müllabfuhr am Vorabend um 18:00 Uhr erinnern</span></label><p class="muted">Die Einstellung wird pro Benutzer gespeichert. Automatische Push-Nachrichten müssen noch technisch eingerichtet werden.</p></div><div class="card"><h3>Benutzerkonto</h3><p class="muted">${esc(user.email)}</p><button class="secondary" onclick="signOut()">Abmelden</button></div><div class="card"><h3>Verbindung</h3><p class="muted">Supabase verbunden. Nur öffentliche Verbindungsschlüssel verwenden.</p></div>`)}
function setWasteReminder(on){prefs.push_preferences={...(prefs.push_preferences||{}),muell:on};savePrefs();toast(on?'Müllerinnerung eingeschaltet':'Müllerinnerung ausgeschaltet')}
function changeTheme(t){prefs.theme=t;applyTheme(t);savePrefs()}
function moveTile(i,d){let a=[...new Set([...(prefs.tile_layout?.length?prefs.tile_layout:modules.map(x=>x[0])),...modules.map(x=>x[0])])],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];prefs.tile_layout=a;savePrefs();settings()}
async function fetchRows(table,order='created_at'){let q=client.from(table).select('*').eq('household_id',household);if(order)q=q.order(order,{ascending:order==='due_date'||order==='meal_date'||order==='starts_at'});let {data,error}=await q;if(error){toast('Datenfehler: '+error.message);return []}return data||[]}
async function insert(table,values){let {error}=await client.from(table).insert({household_id:household,...values});if(error){toast(error.message);return false}toast('Gespeichert');return true}
async function update(table,id,values){let {error}=await client.from(table).update(values).eq('id',id).eq('household_id',household);if(error){toast(error.message);return false}toast('Aktualisiert');return true}
async function remove(table,id){if(!confirm('Diesen Eintrag wirklich löschen?'))return false;let {error}=await client.from(table).delete().eq('id',id).eq('household_id',household);if(error){toast(error.message);return false}toast('Gelöscht');return true}
const taskRoute=c=>c==='hof'?'yard':'tasks';
const repeatLabels={none:'Keine Wiederholung',fixed_week:'Wöchentlich (fester Termin)',fixed_month:'Monatlich (fester Termin)',fixed_year:'Jährlich (fester Termin)',after_days:'Tage nach Erledigung',after_weeks:'Wochen nach Erledigung',after_months:'Monate nach Erledigung'};
function addMonthsISO(iso,n){let [y,m,d]=iso.split('-').map(Number),first=new Date(Date.UTC(y,m-1+n,1)),last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();return `${first.getUTCFullYear()}-${String(first.getUTCMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}
function shiftISO(iso,days){let d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function nextDue(x,when){let r=x.repeat_type||'none',n=Math.max(1,Number(x.repeat_interval)||1),base=x.due_date||when;if(r==='none')return null;if(r==='after_days')return shiftISO(when,n);if(r==='after_weeks')return shiftISO(when,7*n);if(r==='after_months')return addMonthsISO(when,n);let next=base;for(let i=0;i<1000;i++){next=r==='fixed_week'?shiftISO(next,7*n):addMonthsISO(next,(r==='fixed_year'?12:1)*n);if(next>when)return next}return next}
function recurrenceFields(x={}){let r=x.repeat_type||'none';return `<label>Wiederholung</label><select name="repeat_type" onchange="this.form.querySelector('.repeat-count').classList.toggle('hidden',this.value==='none')">${Object.entries(repeatLabels).map(([k,v])=>`<option value="${k}" ${r===k?'selected':''}>${v}</option>`).join('')}</select><div class="repeat-count ${r==='none'?'hidden':''}"><label>Alle wie viele Tage / Wochen / Monate / Jahre?</label><input name="repeat_interval" type="number" min="1" max="365" value="${Number(x.repeat_interval)||1}"></div>`}
function assignmentOptions(x={}){let a=x.assigned_to_both?'both':x.assigned_to||'';return `<option value="" ${!a?'selected':''}>Nicht zugewiesen</option><option value="both" ${a==='both'?'selected':''}>Beide</option>${Object.entries(memberNames).map(([id,n])=>`<option value="${id}" ${a===id?'selected':''}>${esc(n)}</option>`).join('')}`}
function taskForm(category,x=null){return `<div class="card"><h3>${x?'Aufgabe bearbeiten':'Neue Aufgabe'}</h3><form onsubmit="${x?`saveTask(event,'${x.id}','${taskRoute(category)}')`:`addTask(event,'${category}')`}"><label>Was ist zu tun?</label><input name="title" value="${esc(x?.title||'')}" required placeholder="z. B. Rasen mähen"><div class="formgrid"><div><label>Fällig am</label><input name="due" type="date" value="${esc(x?.due_date||'')}"></div><div><label>Zuständig</label><select name="assigned">${assignmentOptions(x||{})}</select></div></div>${recurrenceFields(x||{})}<label>Notizen</label><textarea name="details">${esc(x?.details||'')}</textarea><div class="actions"><button>${x?'Änderungen speichern':'Aufgabe speichern'}</button><button type="button" class="secondary" onclick="go('${taskRoute(category)}')">Abbrechen</button></div></form></div>`}
function taskCard(x,p,done=false){let who=x.assigned_to_both?'Tom & Jana':x.assigned_to?memberNames[x.assigned_to]||'Zugewiesen':'Offen';return `<div class="item"><div class="row"><strong>${esc(x.title)}</strong>${done?'<span class="pill">Erledigt</span>':`<input aria-label="Erledigen" class="check" type="checkbox" onchange="toggleTask('${x.id}',true,'${p}')">`}</div><div class="muted task-meta">${x.due_date?'📅 '+esc(formatDateDE(x.due_date))+' · ':''}${esc(who)}${x.repeat_type&&x.repeat_type!=='none'?' · 🔁 '+esc(repeatLabels[x.repeat_type]||'Wiederholung'):''}</div>${x.details?`<p>${esc(x.details)}</p>`:''}<div class="actions">${done?`<button class="secondary small" onclick="reopenTask('${x.id}','${p}')">↶ Wieder öffnen</button>`:`<button class="secondary small" onclick="editTask('${x.id}','${p}')">Bearbeiten</button>`}<button class="danger small" onclick="deleteAndRefresh('tasks','${x.id}','${p}')">Löschen</button></div></div>`}
async function tasks(p,view='open'){let category=p==='yard'?'hof':'haushalt',rows=(await fetchRows('tasks','due_date')).filter(x=>x.category===category);cache.tasks=rows;let completed=rows.filter(x=>x.completed_at),open=rows.filter(x=>!x.completed_at);let done=view==='done';render(back()+`<div class="row"><h2>${category==='hof'?'🌿 Hof & Reparaturen':'🏠 Haushalt'}</h2><button class="secondary small" onclick="tasks('${p}','${done?'open':'done'}')">${done?'← Offen':'✓ Erledigt'}</button></div>${done?`<p class="muted">Abgeschlossene Aufgaben werden nach vier Monaten aus der Historie entfernt.</p>`:`<div class="actions" style="margin:4px 0 14px"><button onclick="showTaskForm('${category}')">＋ Neue Aufgabe</button></div>`}<h3>${done?'Erledigt':'Offene Aufgaben'} (${done?completed.length:open.length})</h3><div class="stack">${(done?completed.sort((a,b)=>b.completed_at.localeCompare(a.completed_at)):open).map(x=>taskCard(x,p,done)).join('')||`<p class="muted">${done?'Noch keine erledigten Aufgaben.':'Keine offenen Aufgaben.'}</p>`}</div>`);if(done)await loadCompletionDetails(completed,p)}
function showTaskForm(category){render(back()+`<h2>${category==='hof'?'🌿 Hof & Reparaturen':'🏠 Haushalt'}</h2>${taskForm(category)}`)}
function taskPayload(f){let a=f.assigned.value;return {title:f.title.value.trim(),details:f.details.value.trim()||null,due_date:f.due.value||null,assigned_to:a&&a!=='both'?a:null,assigned_to_both:a==='both',repeat_type:f.repeat_type.value,repeat_interval:Math.max(1,Number(f.repeat_interval.value)||1)}}
async function addTask(e,category){e.preventDefault();let payload={category,...taskPayload(e.target)};if(payload.repeat_type!=='none'&&!payload.due_date){toast('Für Wiederholungen bitte ein Fälligkeitsdatum angeben');return}if(await insert('tasks',payload))go(taskRoute(category))}
async function toggleTask(id,checked,p){let x=cache.tasks.find(t=>t.id===id);if(!x)return;let now=new Date(),when=now.toLocaleDateString('en-CA');if(checked){let next=nextDue(x,when);if(next){let {error}=await client.from('tasks').update({due_date:next}).eq('id',id).eq('household_id',household);if(error){toast(error.message);return}let {error:histError}=await client.from('task_completions').insert({household_id:household,task_id:id,completed_by:user.id,completed_at:now.toISOString(),task_title:x.title,task_category:x.category,task_due_date:x.due_date});if(histError){toast('Historie konnte nicht gespeichert werden: '+histError.message);return}}else{let {error}=await client.from('tasks').update({completed_at:now.toISOString()}).eq('id',id).eq('household_id',household);if(error){toast(error.message);return}let {error:histError}=await client.from('task_completions').insert({household_id:household,task_id:id,completed_by:user.id,completed_at:now.toISOString(),task_title:x.title,task_category:x.category,task_due_date:x.due_date});if(histError)toast('Erledigt, aber Historie konnte nicht gespeichert werden: '+histError.message)}go(p)}}
async function loadCompletionDetails(completed,p){let category=p==='yard'?'hof':'haushalt';let {data,error}=await client.from('task_completions').select('*').eq('household_id',household).eq('task_category',category).order('completed_at',{ascending:false});if(error){toast('Historie: '+error.message);return}let history=(data||[]).filter(x=>{let d=new Date(x.completed_at),cut=new Date();cut.setMonth(cut.getMonth()-4);return d>=cut});let container=document.querySelector('.stack');if(!container)return;let html=history.map(x=>{let task=cache.tasks.find(t=>t.id===x.task_id);return `<div class="item"><strong>${esc(x.task_title||task?.title||'Aufgabe')}</strong><div class="muted task-meta">✓ ${new Date(x.completed_at).toLocaleDateString('de-DE')} · ${esc(memberNames[x.completed_by]||'Mitglied')}</div><div class="actions"><button class="secondary small" onclick="undoCompletion('${x.id}','${p}')">↶ Wieder öffnen</button></div></div>`}).join('');container.innerHTML=html||'<p class="muted">Noch keine erledigten Aufgaben.</p>';let h=container.previousElementSibling;if(h)h.textContent=`Erledigt (${history.length})`}
async function undoCompletion(id,p){let {data:h,error}=await client.from('task_completions').select('*').eq('id',id).eq('household_id',household).single();if(error){toast(error.message);return}let x=cache.tasks.find(t=>t.id===h.task_id);if(x){let changes=x.completed_at?{completed_at:null}:{due_date:h.task_due_date||x.due_date};let {error:e}=await client.from('tasks').update(changes).eq('id',x.id).eq('household_id',household);if(e){toast(e.message);return}}let {error:e}=await client.from('task_completions').delete().eq('id',id).eq('household_id',household);if(e){toast(e.message);return}tasks(p,'done')}
async function reopenTask(id,p){let x=cache.tasks.find(t=>t.id===id);if(!x)return;let {error}=await client.from('tasks').update({completed_at:null}).eq('id',id).eq('household_id',household);if(error){toast(error.message);return}let {data}=await client.from('task_completions').select('id').eq('task_id',id).eq('household_id',household).order('completed_at',{ascending:false}).limit(1);if(data?.[0])await client.from('task_completions').delete().eq('id',data[0].id).eq('household_id',household);tasks(p,'done')}
function editTask(id,p){let x=cache.tasks.find(x=>x.id===id);if(!x)return;render(back()+`<h2>Aufgabe bearbeiten</h2>${taskForm(x.category,x)}`)}
async function saveTask(e,id,p){e.preventDefault();let payload=taskPayload(e.target);if(payload.repeat_type!=='none'&&!payload.due_date){toast('Für Wiederholungen bitte ein Fälligkeitsdatum angeben');return}if(await update('tasks',id,payload))go(p)}
async function deleteAndRefresh(t,id,p){if(await remove(t,id))go(p)}
async function ideas(){let rows=await fetchRows('ideas');render(back()+`<h2>💡 Unsere Ideen</h2><div class="card"><h3>Neue Idee</h3><form onsubmit="addIdea(event)"><label>Titel</label><input name="title" required><label>Beschreibung</label><textarea name="body"></textarea><div class="spacer"></div><button>Idee speichern</button></form></div><div class="stack">${rows.map(x=>`<div class="item"><div class="row"><strong>${esc(x.title)}</strong><span class="pill">${x.status==='archived'?'Archiviert':'Offen'}</span></div><p>${esc(x.body)}</p><div class="actions"><button class="secondary small" onclick="ideaToTask('${x.id}')">Als Aufgabe</button><button class="secondary small" onclick="archiveIdea('${x.id}','${x.status}')">${x.status==='archived'?'Wieder öffnen':'Archivieren'}</button><button class="danger small" onclick="deleteAndRefresh('ideas','${x.id}','ideas')">Löschen</button></div></div>`).join('')||'<p class="muted">Noch keine Ideen.</p>'}</div>`);cache.ideas=rows}
async function addIdea(e){e.preventDefault();let f=e.target;if(await insert('ideas',{title:f.title.value.trim(),body:f.body.value.trim()||null}))ideas()}
async function archiveIdea(id,s){if(await update('ideas',id,{status:s==='open'?'archived':'open'}))ideas()}
async function ideaToTask(id){let x=cache.ideas.find(x=>x.id===id);if(!x)return;if(await insert('tasks',{category:'haushalt',title:x.title,details:x.body||null}))toast('Zur Haushaltsliste hinzugefügt')}
const cats={fleisch:'Fleisch',fisch:'Fisch',vegetarisch:'Vegetarisch',suppen:'Suppen & Eintöpfe',auflauf:'Aufläufe',pasta:'Pizza & Pasta',schnell:'Schnelle Gerichte',dessert:'Desserts'};
async function recipes(){let [rows,plan,ingredients]=await Promise.all([fetchRows('recipes'),fetchRows('meal_plan','meal_date'),fetchRows('recipe_ingredients',null)]);cache.recipes=rows;cache.ingredients=ingredients;render(back()+`<h2>🍲 Rezepte & Wochenplan</h2><div class="card"><h3>Gericht planen</h3><form onsubmit="addMeal(event)"><label>Tag</label><input type="date" name="date" value="${new Date().toLocaleDateString('en-CA')}" required><label>Rezept</label><select name="recipe" required><option value="">Bitte wählen</option>${rows.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select><label>Portionen</label><input type="number" name="portions" min="1" value="2" required><div class="spacer"></div><button>Für den Tag einplanen</button></form><div class="stack" style="margin-top:15px">${plan.map(x=>`<div class="row item"><span><strong>${esc(x.meal_date)}</strong><br>${esc(rows.find(r=>r.id===x.recipe_id)?.title||'Rezept gelöscht')} · ${x.portions} Portionen</span><button class="danger small" onclick="deleteAndRefresh('meal_plan','${x.id}','recipes')">×</button></div>`).join('')||'<p class="muted">Noch keine Gerichte geplant.</p>'}</div></div><div class="card"><h3>Einkaufsliste aus dem Wochenplan</h3><div id="shopping">${shoppingList(plan,rows,ingredients)}</div></div><div class="card"><h3>Neues Rezept</h3><form onsubmit="addRecipe(event)"><label>Name</label><input name="title" required><label>Kategorie</label><select name="category">${Object.entries(cats).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label>Portionen</label><input name="portions" type="number" min="1" value="2" required><label>Zubereitung</label><textarea name="instructions"></textarea><div class="spacer"></div><button>Rezept speichern</button></form></div><h3>Rezeptsammlung</h3><div class="stack">${rows.map(x=>`<div class="item"><div class="row"><strong>${esc(x.title)}</strong><span class="pill">${esc(cats[x.category]||x.category)}</span></div><p class="muted">${x.portions} Portionen</p>${x.instructions?`<p>${esc(x.instructions)}</p>`:''}<h3>Zutaten</h3><div class="muted">${ingredients.filter(i=>i.recipe_id===x.id).map(i=>`${esc(i.quantity??'')} ${esc(i.unit||'')} ${esc(i.ingredient)}`).join('<br>')||'Noch keine Zutaten'}</div><form onsubmit="addIngredient(event,'${x.id}')"><div class="formgrid"><div><label>Zutat</label><input name="ingredient" required></div><div><label>Menge</label><input name="quantity" type="number" step="any" min="0"></div></div><label>Einheit (g, kg, ml, Stück …)</label><input name="unit"><div class="spacer"></div><button class="secondary small">Zutat hinzufügen</button></form><div class="actions"><button class="danger small" onclick="deleteAndRefresh('recipes','${x.id}','recipes')">Rezept löschen</button></div></div>`).join('')||'<p class="muted">Noch keine Rezepte gespeichert.</p>'}</div>`)}
function shoppingList(plan,rows,ingredients){let sums=new Map();for(let meal of plan){let r=rows.find(x=>x.id===meal.recipe_id);if(!r)continue;for(let i of ingredients.filter(x=>x.recipe_id===r.id)){let key=i.ingredient.trim().toLowerCase()+'|'+(i.unit||'').trim().toLowerCase(),qty=i.quantity==null?null:Number(i.quantity)*meal.portions/r.portions;if(!sums.has(key))sums.set(key,{name:i.ingredient,unit:i.unit||'',qty:0,hasQty:false});let v=sums.get(key);if(qty!=null){v.qty+=qty;v.hasQty=true}}}return [...sums.values()].map(x=>`<label style="display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)"><input type="checkbox" class="check" style="width:20px"> ${x.hasQty?Math.round(x.qty*100)/100+' ':''}${esc(x.unit)} ${esc(x.name)}</label>`).join('')||'<p class="muted">Die Einkaufsliste entsteht automatisch aus den eingeplanten Rezepten.</p>'}
async function addRecipe(e){e.preventDefault();let f=e.target;if(await insert('recipes',{title:f.title.value.trim(),category:f.category.value,portions:Number(f.portions.value),instructions:f.instructions.value.trim()||null}))recipes()}
async function addIngredient(e,id){e.preventDefault();let f=e.target;if(await insert('recipe_ingredients',{recipe_id:id,ingredient:f.ingredient.value.trim(),quantity:f.quantity.value?Number(f.quantity.value):null,unit:f.unit.value.trim()||null}))recipes()}
async function addMeal(e){e.preventDefault();let f=e.target;let {error}=await client.from('meal_plan').upsert({household_id:household,meal_date:f.date.value,recipe_id:f.recipe.value,portions:Number(f.portions.value)},{onConflict:'household_id,meal_date'});if(error)toast(error.message);else{toast('Wochenplan aktualisiert');recipes()}}
async function assets(){let [rows,maintenance]=await Promise.all([fetchRows('assets',null),fetchRows('maintenance','due_date')]);render(back()+`<h2>🚗 Fahrzeuge & Wartung</h2><div class="card"><h3>Fahrzeug oder Gerät hinzufügen</h3><form onsubmit="addAsset(event)"><label>Bezeichnung</label><input name="name" required placeholder="z. B. Auto, Anhänger, Rasenmäher"><label>Kennzeichen (optional)</label><input name="registration"><label>Notizen</label><textarea name="notes"></textarea><div class="spacer"></div><button>Speichern</button></form></div><div class="card"><h3>Wartung / TÜV eintragen</h3><form onsubmit="addMaintenance(event)"><label>Fahrzeug / Gerät</label><select name="asset" required><option value="">Bitte wählen</option>${rows.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><label>Was steht an?</label><input name="title" required placeholder="z. B. Hauptuntersuchung"><label>Fällig am</label><input type="date" name="due" required><label>Notizen</label><textarea name="notes"></textarea><div class="spacer"></div><button>Termin speichern</button></form></div><h3>Fälligkeiten</h3><div class="stack">${maintenance.map(x=>`<div class="item"><strong>${esc(x.title)}</strong><p class="muted">${esc(rows.find(a=>a.id===x.asset_id)?.name||'Gerät')} · ${esc(x.due_date)}</p>${x.notes?`<p>${esc(x.notes)}</p>`:''}<button class="danger small" onclick="deleteAndRefresh('maintenance','${x.id}','assets')">Löschen</button></div>`).join('')||'<p class="muted">Noch keine Wartungstermine.</p>'}</div><h3>Meine Fahrzeuge & Geräte</h3><div class="stack">${rows.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><p class="muted">${esc(x.registration||'')} ${esc(x.notes||'')}</p><button class="danger small" onclick="deleteAndRefresh('assets','${x.id}','assets')">Löschen</button></div>`).join('')||'<p class="muted">Noch keine Geräte.</p>'}</div>`)}
async function addAsset(e){e.preventDefault();let f=e.target;if(await insert('assets',{name:f.name.value.trim(),registration:f.registration.value.trim()||null,notes:f.notes.value.trim()||null}))assets()}
async function addMaintenance(e){e.preventDefault();let f=e.target;if(await insert('maintenance',{asset_id:f.asset.value,title:f.title.value.trim(),due_date:f.due.value,notes:f.notes.value.trim()||null}))assets()}
async function calendar(){let rows=await fetchRows('calendar_events','starts_at');render(back()+`<h2>📅 Gemeinsamer Kalender</h2><div class="card"><h3>🗑 WBC-Abfallkalender</h3><p class="muted">iCal-Datei (.ics) importieren. Familientonne wird ausgelassen; bereits vorhandene Abfuhrtermine werden nicht doppelt angelegt.</p><input type="file" accept=".ics,text/calendar" onchange="importWasteCalendar(this.files[0])"></div><div class="notice">Termine werden in Haus & Hof gemeinsam gespeichert. Eine automatische Apple-Kalender-Synchronisierung ist noch nicht eingebaut.</div><div class="card"><h3>Neuer Termin</h3><form onsubmit="addEvent(event)"><label>Titel</label><input name="title" required><label>Beginn</label><input type="datetime-local" name="start" required><label>Ende (optional)</label><input type="datetime-local" name="end"><label>Notizen</label><textarea name="notes"></textarea><div class="spacer"></div><button>Termin speichern</button></form></div><h3>Termine</h3><div class="stack">${rows.map(x=>`<div class="item"><strong>${esc(x.title)}</strong><p class="muted">${new Date(x.starts_at).toLocaleString('de-DE')}${x.ends_at?' – '+new Date(x.ends_at).toLocaleString('de-DE'):''}</p>${x.notes?`<p>${esc(x.notes)}</p>`:''}<button class="danger small" onclick="deleteAndRefresh('calendar_events','${x.id}','calendar')">Löschen</button></div>`).join('')||'<p class="muted">Noch keine Termine.</p>'}</div>`)}
async function importWasteCalendar(file){
 if(!file)return;
 let raw=await file.text(),blocks=raw.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1),entries=[];
 for(const b of blocks){let field=k=>{let line=b.split('\n').find(x=>x.startsWith(k+':')||x.startsWith(k+';'));return line?line.slice(line.indexOf(':')+1).trim():''};let name=field('SUMMARY'),date=field('DTSTART').slice(0,8),uid=field('UID');if(!/^(Restmüll|Bioabfall|Papier|Gelbe Tonne)/i.test(name)||!/^[0-9]{8}$/.test(date)||!uid)continue;let iso=date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8);entries.push({household_id:household,title:name,starts_at:iso+'T12:00:00Z',notes:'WBC-Abfallkalender · '+iso,apple_event_uid:'wbc-'+uid})}
 if(!entries.length){toast('Keine passenden Abfuhrtermine gefunden');return}
 let {data:existing,error:readError}=await client.from('calendar_events').select('apple_event_uid').eq('household_id',household).like('apple_event_uid','wbc-%');if(readError){toast(readError.message);return}
 let ids=new Set((existing||[]).map(x=>x.apple_event_uid)),fresh=entries.filter(x=>!ids.has(x.apple_event_uid));if(!fresh.length){toast('Alle Abfuhrtermine sind bereits vorhanden');return}
 let {error}=await client.from('calendar_events').insert(fresh);if(error){toast('Import fehlgeschlagen: '+error.message);return}toast(fresh.length+' Abfuhrtermine importiert');calendar()
}
async function addEvent(e){e.preventDefault();let f=e.target;if(f.end.value&&f.end.value<f.start.value){toast('Das Ende muss nach dem Beginn liegen');return}if(await insert('calendar_events',{title:f.title.value.trim(),starts_at:new Date(f.start.value).toISOString(),ends_at:f.end.value?new Date(f.end.value).toISOString():null,notes:f.notes.value.trim()||null}))calendar()}
(async()=>{applyTheme('black_copper');if(!window.supabase){render('<div class="notice error">Die Supabase-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</div>');return}if(!initClient()){setup();return}await start()})();
</script></body></html>
