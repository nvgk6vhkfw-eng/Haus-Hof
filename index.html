 const today=new Date().toLocaleDateString('en-CA');

 ]);

 if(page!=='home'||household!==thisHousehold)return;
 const dateLabel=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});

 const eventDate=event?new Date(event.starts_at).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
 const line=(icon,label,value,meta,target)=>`<button class="today-line" onclick="go('${target}')"><span class="today-icon">${icon}</span><span class="today-content"><span class="today-label">${label}</span><span class="today-value">${esc(value)}</span>${meta?`<span class="today-meta">${esc(meta)}</span>`:''}</span><span class="today-arrow">›</span></button>`;
 const overview=`<div class="today-card">${line('✓','Nächste Aufgabe',task?.title||'Keine fälligen Aufgaben',task?(task.due_date<today?'Überfällig · ':task.due_date===today?'Heute · ':'Fällig am ')+taskDate:'',task?.category==='hof'?'yard':'tasks')}${line('▦','Nächster Termin',event?.title||'Kein anstehender Termin',eventDate,'calendar')}${line('♨','Heute gibt es',mealTitle||'Noch kein Essen geplant',mealTitle?meal.portions+' Portionen':'','recipes')}${maintenanceResult.data?.[0]?line('🔧','Nächste Wartung',maintenanceResult.data[0].title,formatDateDE(maintenanceResult.data[0].due_date),'assets'):''}${wasteResult.data?.[0]?line('🗑','Nächste Müllabfuhr',wasteResult.data[0].title,new Date(wasteResult.data[0].starts_at).toLocaleDateString('de-DE'),'calendar'):''}</div>`;
 render(`<p class="muted home-greeting">Hallo ${esc(memberNames[user.id]||'ihr zwei')} 👋 · ${esc(dateLabel)}</p>${overview}<div class="today-heading">Unsere Bereiche</div><div class="grid home-tiles">${ordered.map(m=>`<button class="tile" onclick="go('${m[0]}')"><span class="emoji">${m[1]}</span><span><strong>${m[2]}</strong><br><small>${m[3]}</small>${['tasks','yard'].includes(m[0])?`<span class="tile-count" onclick="event.stopPropagation();go('${m[0]}')">${(allTasksResult.data||[]).filter(t=>t.category===(m[0]==='yard'?'hof':'haushalt')).length||''}</span>`:m[0]==='shopping'&&shoppingResult.data?.length?`<span class="tile-count" onclick="event.stopPropagation();go('shopping')">${shoppingResult.data.length}</span>`:''}</span></button>`).join('')}</div>`);
 if(tasksResult.error||eventsResult.error||mealResult.error)toast('Tagesübersicht konnte teilweise nicht geladen werden');

function settings(){render(back()+`<h2>Einstellungen</h2><div class="card"><h3>Mein Design</h3><label>Farbthema</label><select id="theme" onchange="changeTheme(this.value)">${Object.entries(themeNames).map(([k,v])=>`<option value="${k}" ${prefs.theme===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="card"><h3>Meine Kacheln</h3><p class="muted">Reihenfolge mit den Pfeilen ändern.</p><div class="stack">${[...new Set([...(prefs.tile_layout?.length?prefs.tile_layout:modules.map(x=>x[0])),...modules.map(x=>x[0])])].map((id,i)=>{let m=modules.find(x=>x[0]===id);return m?`<div class="row item"><span>${m[1]} ${m[2]}</span><span><button class="small secondary" onclick="moveTile(${i},-1)">↑</button> <button class="small secondary" onclick="moveTile(${i},1)">↓</button></span></div>`:''}).join('')}</div></div><div class="card"><h3>Erinnerungen</h3><label class="row" style="align-items:center;gap:12px"><input type="checkbox" style="width:auto" ${prefs.push_preferences?.muell!==false?'checked':''} onchange="setWasteReminder(this.checked)"><span>Müllabfuhr am Vorabend um 18:00 Uhr erinnern</span></label><p class="muted">Die Einstellung wird pro Benutzer gespeichert. Automatische Push-Nachrichten müssen noch technisch eingerichtet werden.</p></div><div class="card"><h3>Benutzerkonto</h3><p class="muted">${esc(user.email)}</p><button class="secondary" onclick="signOut()">Abmelden</button></div><div class="card"><h3>Verbindung</h3><p class="muted">Supabase verbunden. Nur öffentliche Verbindungsschlüssel verwenden.</p></div>`)}

function moveTile(i,d){let a=[...new Set([...(prefs.tile_layout?.length?prefs.tile_layout:modules.map(x=>x[0])),...modules.map(x=>x[0])])],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];prefs.tile_layout=a;savePrefs();settings()}
async function fetchRows(table,order='created_at'){let q=client.from(table).select('*').eq('household_id',household);if(order)q=q.order(order,{ascending:order==='due_date'||order==='meal_date'||order==='starts_at'});let {data,error}=await q;if(error){toast('Datenfehler: '+error.message);return []}return data||[]}

function appConfirm(message,title='Bitte bestätigen',danger=false){return new Promise(resolve=>{const layer=document.createElement('div');layer.className='hh-modal-backdrop';layer.innerHTML=`<div class="hh-modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(message)}</p><div class="actions"><button type="button" class="secondary" data-choice="no">Abbrechen</button><button type="button" class="${danger?'danger-confirm':''}" data-choice="yes">${danger?'Löschen':'Bestätigen'}</button></div></div>`;document.body.appendChild(layer);const finish=value=>{document.removeEventListener('keydown',key);layer.remove();resolve(value)};const key=e=>{if(e.key==='Escape')finish(false)};document.addEventListener('keydown',key);layer.querySelector('[data-choice=no]').onclick=()=>finish(false);layer.querySelector('[data-choice=yes]').onclick=()=>finish(true);layer.addEventListener('click',e=>{if(e.target===layer)finish(false)})})}
function localISO(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function upcomingShoppingFriday(){const today=new Date();today.setHours(12,0,0,0);const days=(5-today.getDay()+7)%7;today.setDate(today.getDate()+days);return localISO(today)}
async function remove(table,id){if(!await appConfirm('Möchtest du diesen Eintrag wirklich dauerhaft löschen?','Eintrag löschen?',true))return false;let {error}=await client.from(table).delete().eq('id',id).eq('household_id',household);if(error){toast(error.message);return false}toast('Gelöscht');return true}
const taskRoute=c=>c==='hof'?'yard':'tasks';
const repeatLabels={none:'Keine Wiederholung',fixed_week:'Wöchentlich (fester Termin)',fixed_month:'Monatlich (fester Termin)',fixed_year:'Jährlich (fester Termin)',after_days:'Tage nach Erledigung',after_weeks:'Wochen nach Erledigung',after_months:'Monate nach Erledigung'};
function addMonthsISO(iso,n){let [y,m,d]=iso.split('-').map(Number),first=new Date(Date.UTC(y,m-1+n,1)),last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();return `${first.getUTCFullYear()}-${String(first.getUTCMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}
function shiftISO(iso,days){let d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function nextDue(x,when){let r=x.repeat_type||'none',n=Math.max(1,Number(x.repeat_interval)||1),base=x.due_date||when;if(r==='none')return null;if(r==='after_days')return shiftISO(when,n);if(r==='after_weeks')return shiftISO(when,7*n);if(r==='after_months')return addMonthsISO(when,n);let next=base;for(let i=0;i<1000;i++){next=r==='fixed_week'?shiftISO(next,7*n):addMonthsISO(next,(r==='fixed_year'?12:1)*n);if(next>when)return next}return next}
function recurrenceFields(x={}){let r=x.repeat_type||'none';return `<label>Wiederholung</label><select name="repeat_type" onchange="this.form.querySelector('.repeat-count').classList.toggle('hidden',this.value==='none')">${Object.entries(repeatLabels).map(([k,v])=>`<option value="${k}" ${r===k?'selected':''}>${v}</option>`).join('')}</select><div class="repeat-count ${r==='none'?'hidden':''}"><label>Alle wie viele Tage / Wochen / Monate / Jahre?</label><input name="repeat_interval" type="number" min="1" max="365" value="${Number(x.repeat_interval)||1}"></div>`}
function assignmentOptions(x={}){let a=x.assigned_to_both?'both':x.assigned_to||'';return `<option value="" ${!a?'selected':''}>Nicht zugewiesen</option><option value="both" ${a==='both'?'selected':''}>Beide</option>${Object.entries(memberNames).map(([id,n])=>`<option value="${id}" ${a===id?'selected':''}>${esc(n)}</option>`).join('')}`}
function taskForm(category,x=null){return `<div class="card"><h3>${x?'Aufgabe bearbeiten':'Neue Aufgabe'}</h3><form onsubmit="${x?`saveTask(event,'${x.id}','${taskRoute(category)}')`:`addTask(event,'${category}')`}"><label>Was ist zu tun?</label><input name="title" value="${esc(x?.title||'')}" required placeholder="z. B. Rasen mähen"><div class="formgrid"><div><label>Fällig am</label><input name="due" type="date" lang="de-DE" value="${esc(x?.due_date||'')}"></div><div><label>Zuständig</label><select name="assigned">${assignmentOptions(x||{})}</select></div></div>${recurrenceFields(x||{})}<label>Notizen</label><textarea name="details">${esc(x?.details||'')}</textarea><div class="actions"><button>${x?'Änderungen speichern':'Aufgabe speichern'}</button><button type="button" class="secondary" onclick="go('${taskRoute(category)}')">Abbrechen</button></div></form></div>`}
function taskCard(x,p,done=false){let who=x.assigned_to_both?'Tom & Jana':x.assigned_to?memberNames[x.assigned_to]||'Zugewiesen':'Offen';let today=localISO(),dueClass=done?'task-due-done':x.due_date&&x.due_date<today?'task-due-overdue':x.due_date===today?'task-due-today':'';let dateLabel=x.due_date?`<span class="${dueClass}">📅 ${esc(formatDateDE(x.due_date))}${!done&&x.due_date<today?' · Überfällig':!done&&x.due_date===today?' · Heute':''}</span> · `:'';return `<div class="item task-compact"><div class="task-top"><div class="task-main"><strong class="task-title">${esc(x.title)}</strong><div class="muted task-meta">${dateLabel}${esc(who)}${x.repeat_type&&x.repeat_type!=='none'?' · 🔁 '+esc(repeatLabels[x.repeat_type]||'Wiederholung'):''}</div></div>${done?'<span class="pill task-due-done">✓ Erledigt</span>':`<input aria-label="Erledigen" class="check" type="checkbox" onchange="toggleTask('${x.id}',true,'${p}')">`}<details class="task-menu"><summary aria-label="Weitere Optionen">⋯</summary><div class="menu-options">${done?`<button class="secondary small" onclick="reopenTask('${x.id}','${p}')">↶ Wieder öffnen</button>`:`<button class="secondary small" onclick="editTask('${x.id}','${p}')">✎ Bearbeiten</button>`}<button class="danger small" onclick="deleteAndRefresh('tasks','${x.id}','${p}')">Löschen</button></div></details></div>${x.details?`<p class="muted">${esc(x.details)}</p>`:''}</div>`}
async function tasks(p,view='open'){let category=p==='yard'?'hof':'haushalt',rows=(await fetchRows('tasks','due_date')).filter(x=>x.category===category);cache.tasks=rows;let completed=rows.filter(x=>x.completed_at),open=rows.filter(x=>!x.completed_at);let done=view==='done';render(back()+`<div class="row"><h2>${category==='hof'?'🌿 Hof & Reparaturen':'🏠 Haushalt'}</h2><button class="secondary small" onclick="tasks('${p}','${done?'open':'done'}')">${done?'← Offen':'✓ Erledigt'}</button></div>${done?`<p class="muted">Abgeschlossene Aufgaben werden nach vier Monaten aus der Historie entfernt.</p>`:`<div class="actions" style="margin:4px 0 14px"><button onclick="showTaskForm('${category}')">＋ Neue Aufgabe</button></div>`}<h3>${done?'Erledigt':'Offene Aufgaben'} (${done?completed.length:open.length})</h3><div class="stack">${(done?completed.sort((a,b)=>b.completed_at.localeCompare(a.completed_at)):open).map(x=>taskCard(x,p,done)).join('')||`<p class="muted">${done?'Noch keine erledigten Aufgaben.':'Keine offenen Aufgaben.'}</p>`}</div>`);if(done)await loadCompletionDetails(completed,p)}
function showTaskForm(category){render(back()+`<h2>${category==='hof'?'🌿 Hof & Reparaturen':'🏠 Haushalt'}</h2>${taskForm(category)}`)}
function taskPayload(f){let a=f.assigned.value;return {title:f.title.value.trim(),details:f.details.value.trim()||null,due_date:f.due.value||null,assigned_to:a&&a!=='both'?a:null,assigned_to_both:a==='both',repeat_type:f.repeat_type.value,repeat_interval:Math.max(1,Number(f.repeat_interval.value)||1)}}
async function addTask(e,category){e.preventDefault();let payload={category,...taskPayload(e.target)};if(payload.repeat_type!=='none'&&!payload.due_date){toast('Für Wiederholungen bitte ein Fälligkeitsdatum angeben');return}if(await insert('tasks',payload))go(taskRoute(category))}
async function toggleTask(id,checked,p){let x=cache.tasks.find(t=>t.id===id);if(!x)return;let now=new Date(),when=now.toLocaleDateString('en-CA');if(checked){let next=nextDue(x,when);if(next){let {error}=await client.from('tasks').update({due_date:next}).eq('id',id).eq('household_id',household);if(error){toast(error.message);return}let {error:histError}=await client.from('task_completions').insert({household_id:household,task_id:id,completed_by:user.id,completed_at:now.toISOString(),task_title:x.title,task_category:x.category,task_due_date:x.due_date});if(histError){toast('Historie konnte nicht gespeichert werden: '+histError.message);return}}else{let {error}=await client.from('tasks').update({completed_at:now.toISOString()}).eq('id',id).eq('household_id',household);if(error){toast(error.message);return}let {error:histError}=await client.from('task_completions').insert({household_id:household,task_id:id,completed_by:user.id,completed_at:now.toISOString(),task_title:x.title,task_category:x.category,task_due_date:x.due_date});if(histError)toast('Erledigt, aber Historie konnte nicht gespeichert werden: '+histError.message)}go(p)}}
async function loadCompletionDetails(completed,p){let category=p==='yard'?'hof':'haushalt';let {data,error}=await client.from('task_completions').select('*').eq('household_id',household).eq('task_category',category).order('completed_at',{ascending:false});if(error){toast('Historie: '+error.message);return}let history=(data||[]).filter(x=>{let d=new Date(x.completed_at),cut=new Date();cut.setMonth(cut.getMonth()-4);return d>=cut});let container=document.querySelector('.stack');if(!container)return;let html=history.map(x=>{let task=cache.tasks.find(t=>t.id===x.task_id);return `<div class="item"><strong>${esc(x.task_title||task?.title||'Aufgabe')}</strong><div class="muted task-meta">✓ ${new Date(x.completed_at).toLocaleDateString('de-DE')} · ${esc(memberNames[x.completed_by]||'Mitglied')}</div><div class="actions"><button class="secondary small" onclick="undoCompletion('${x.id}','${p}')">↶ Wieder öffnen</button></div></div>`}).join('');container.innerHTML=html||'<p class="muted">Noch keine erledigten Aufgaben.</p>';let h=container.previousElementSibling;if(h)h.textContent=`Erledigt (${history.length})`}
async function undoCompletion(id,p){let {data:h,error}=await client.from('task_completions').select('*').eq('id',id).eq('household_id',household).single();if(error){toast(error.message);return}let x=cache.tasks.find(t=>t.id===h.task_id);if(x){let changes=x.completed_at?{completed_at:null}:{due_date:h.task_due_date||x.due_date};let {error:e}=await client.from('tasks').update(changes).eq('id',x.id).eq('household_id',household);if(e){toast(e.message);return}}let {error:e}=await client.from('task_completions').delete().eq('id',id).eq('household_id',household);if(e){toast(e.message);return}tasks(p,'done')}
async function reopenTask(id,p){let x=cache.tasks.find(t=>t.id===id);if(!x)return;let {error}=await client.from('tasks').update({completed_at:null}).eq('id',id).eq('household_id',household);if(error){toast(error.message);return}let {data}=await client.from('task_completions').select('id').eq('task_id',id).eq('household_id',household).order('completed_at',{ascending:false}).limit(1);if(data?.[0])await client.from('task_completions').delete().eq('id',data[0].id).eq('household_id',household);tasks(p,'done')}
function editTask(id,p){let x=cache.tasks.find(x=>x.id===id);if(!x)return;render(back()+`<h2>Aufgabe bearbeiten</h2>${taskForm(x.category,x)}`)}
async function saveTask(e,id,p){e.preventDefault();let payload=taskPayload(e.target);if(payload.repeat_type!=='none'&&!payload.due_date){toast('Für Wiederholungen bitte ein Fälligkeitsdatum angeben');return}if(await update('tasks',id,payload))go(p)}
async function deleteAndRefresh(t,id,p){if(await remove(t,id))go(p)}
async function ideas(){let rows=await fetchRows('ideas');render(back()+`<h2>💡 Unsere Ideen</h2><div class="card"><h3>Neue Idee</h3><form onsubmit="addIdea(event)"><label>Titel</label><input name="title" required><label>Beschreibung</label><textarea name="body"></textarea><div class="spacer"></div><button>Idee speichern</button></form></div><div class="stack">${rows.map(x=>`<div class="item"><div class="row"><strong>${esc(x.title)}</strong><span class="pill">${x.status==='archived'?'Archiviert':'Offen'}</span></div><p>${esc(x.body)}</p><div class="actions"><button class="secondary small" onclick="ideaToTask('${x.id}')">Als Aufgabe</button><button class="secondary small" onclick="archiveIdea('${x.id}','${x.status}')">${x.status==='archived'?'Wieder öffnen':'Archivieren'}</button><button class="danger small" onclick="deleteAndRefresh('ideas','${x.id}','ideas')">Löschen</button></div></div>`).join('')||'<p class="muted">Noch keine Ideen.</p>'}</div>`);cache.ideas=rows}
async function addIdea(e){e.preventDefault();let f=e.target;if(await insert('ideas',{title:f.title.value.trim(),body:f.body.value.trim()||null}))ideas()}
async function archiveIdea(id,s){if(await update('ideas',id,{status:s==='open'?'archived':'open'}))ideas()}
async function ideaToTask(id){let x=cache.ideas.find(x=>x.id===id);if(!x)return;if(await insert('tasks',{category:'haushalt',title:x.title,details:x.body||null}))toast('Zur Haushaltsliste hinzugefügt')}
const cats={fleisch:'Fleisch',fisch:'Fisch',vegetarisch:'Vegetarisch',suppen:'Suppen & Eintöpfe',auflauf:'Aufläufe',pasta:'Pizza & Pasta',schnell:'Schnelle Gerichte',dessert:'Desserts'};
const recipeSeasons={all:'Ganzjährig',summer:'Sommer',winter:'Winter'};
let recipeTab='start';
function localISO(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function nextMealFriday(){let d=new Date();let day=d.getDay(),offset=(5-day+7)%7;d.setDate(d.getDate()+offset);return localISO(d)}
function recipePhoto(r){return r.photo_data?`<img class="recipe-photo" src="${esc(r.photo_data)}" alt="Rezeptfoto" loading="lazy">`:'<div class="recipe-photo recipe-placeholder">🍲</div>'}
async function recipes(tab=recipeTab){recipeTab=tab;const [rows,plan,ingredients]=await Promise.all([fetchRows('recipes'),fetchRows('meal_plan','meal_date'),fetchRows('recipe_ingredients',null)]);cache.recipes=rows;cache.mealPlan=plan;cache.ingredients=ingredients;
 const intro=back()+`<h2>🍲 Rezepte & Wochenplan</h2>`;
 if(tab==='start'){render(intro+`<div class="recipe-home"><button onclick="recipes('week')"><span>🗓️</span><strong>Woche planen</strong><small>Gerichte wählen oder Zufall</small></button><button onclick="recipes('list')"><span>📖</span><strong>Rezepte</strong><small>${rows.length} gespeichert · Neue hinzufügen</small></button></div>`);return}
 if(tab==='list'){render(intro+`<div class="row"><h3>Meine Rezeptsammlung</h3><button class="small" onclick="recipeEditor()">＋ Neues Rezept</button></div><input id="recipe-search" placeholder="Rezepte suchen …" oninput="filterRecipeCards(this.value)"><div class="recipe-grid" id="recipe-cards">${rows.map(r=>`<div class="recipe-card" data-search="${esc((r.title+' '+(cats[r.category]||'')).toLowerCase())}"><button class="recipe-open" onclick="recipeDetail('${r.id}')">${recipePhoto(r)}<strong>${esc(r.title)}</strong><small>${r.prep_minutes?Number(r.prep_minutes)+' Min. · ':''}${esc(cats[r.category]||r.category||'Rezept')}</small></button><button class="recipe-quick" title="Für die Woche einplanen" onclick="quickRecipe('${r.id}')">🗓 ＋ Woche</button></div>`).join('')||'<p class="muted">Noch keine Rezepte. Tippe auf „Neues Rezept“.</p>'}</div>`);return}
 if(tab==='week'){let week=window.mealWeek||nextMealFriday(),days=Array.from({length:7},(_,i)=>shiftISO(week,i));render(intro+`<div class="card"><div class="row"><button class="secondary small" onclick="changeMealWeek(-7)">‹ Vorherige</button><strong>${formatDateDE(week)} – ${formatDateDE(days[6])}</strong><button class="secondary small" onclick="changeMealWeek(7)">Nächste ›</button></div></div><div class="stack">${days.map(d=>{let m=plan.find(x=>x.meal_date===d),r=rows.find(x=>x.id===m?.recipe_id);return `<div class="recipe-day"><div><strong>${new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long'})} · ${formatDateDE(d)}</strong><p class="muted">${m?esc(r?.title||'Rezept gelöscht')+' · '+m.portions+' Portionen':'Noch nichts geplant'}</p>${m?.dessert?`<small>Dessert: ${esc(m.dessert)}</small>`:''}</div><div class="recipe-day-actions"><button class="secondary small" onclick="mealDayForm('${d}')">${m?'Ändern':'＋ Wählen'}</button><button class="secondary small" onclick="randomMeal('${d}')">🎲 Zufall</button>${m?`<button class="secondary small" onclick="deleteAndRefresh('meal_plan','${m.id}','recipes')">Entfernen</button>`:''}</div></div>`}).join('')}</div><div class="card"><h3>Einkaufsbedarf</h3>${shoppingList(plan.filter(x=>days.includes(x.meal_date)),rows,ingredients)}<button class="secondary small" onclick="go('shopping')">🛒 Einkaufsliste auswählen</button></div>`);return}
}
function changeMealWeek(delta){window.mealWeek=shiftISO(window.mealWeek||nextMealFriday(),delta);recipes('week')}
function filterRecipeCards(q){for(let el of document.querySelectorAll('#recipe-cards .recipe-card'))el.style.display=el.dataset.search.includes(q.toLowerCase())?'':'none'}
function recipeDetail(id){let r=cache.recipes.find(x=>x.id===id);if(!r)return;let ins=cache.ingredients.filter(x=>x.recipe_id===id);render(back()+`<div class="recipe-detail-photo">${recipePhoto(r)}</div><h2>${esc(r.title)}</h2><p class="muted">${r.prep_minutes?Number(r.prep_minutes)+' Minuten · ':''}${r.portions} Portionen · ${esc(cats[r.category]||r.category||'Rezept')}</p><div class="actions"><button onclick="quickRecipe('${id}')">🗓 Für Woche einplanen</button><button class="secondary" onclick="recipeEditor('${id}')">✎ Bearbeiten</button></div><div class="card"><h3>Zutaten</h3>${ins.map(i=>`<div class="recipe-ingredient">${esc([i.quantity??'',i.unit||'',i.ingredient].join(' ').trim())}</div>`).join('')||'<p class="muted">Noch keine Zutaten.</p>'}</div><div class="card"><h3>Zubereitung</h3><p style="white-space:pre-wrap">${esc(r.instructions||'Noch keine Beschreibung.')}</p>${r.source_url?`<a href="${esc(r.source_url)}" target="_blank" rel="noopener noreferrer">Rezeptquelle öffnen</a>`:''}</div><button class="danger small" onclick="deleteRecipeConfirm('${id}')">Rezept löschen</button>`)}
async function deleteRecipeConfirm(id){if(!await appConfirm('Möchtest du dieses Rezept wirklich dauerhaft löschen?','Rezept löschen?',true))return;let {error}=await client.from('recipes').delete().eq('household_id',household).eq('id',id);if(error)toast(error.message);else recipes('list')}
function recipeEditor(id=''){let r=cache.recipes.find(x=>x.id===id),ins=cache.ingredients.filter(x=>x.recipe_id===id);render(back()+`<h2>${r?'Rezept bearbeiten':'Neues Rezept'}</h2><div class="card"><form onsubmit="saveRecipeEditor(event,'${id}')"><label>Rezeptname</label><input name="title" required value="${esc(r?.title||'')}" placeholder="z. B. Spaghetti Bolognese"><label>Foto (optional)</label>${r?.photo_data?`<img class="recipe-edit-preview" src="${esc(r.photo_data)}" alt="Aktuelles Foto">`:''}<input name="photo" type="file" accept="image/*"><small class="muted">Das Foto wird vor dem Speichern verkleinert.</small><label>Kategorie</label><select name="category">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${r?.category===k?'selected':''}>${v}</option>`).join('')}</select><div class="formgrid"><div><label>Portionen</label><input name="portions" type="number" min="1" value="${r?.portions||2}" required></div><div><label>Zeit in Minuten</label><input name="prep_minutes" type="number" min="0" value="${r?.prep_minutes||''}" placeholder="30"></div></div><label>Saison</label><select name="season">${Object.entries(recipeSeasons).map(([k,v])=>`<option value="${k}" ${r?.season===k?'selected':''}>${v}</option>`).join('')}</select><label>Zutaten – eine pro Zeile</label><textarea name="ingredients" rows="6" placeholder="500 g Nudeln&#10;2 Tomaten&#10;1 Zwiebel">${esc(ins.map(i=>[i.quantity??'',i.unit||'',i.ingredient].join(' ').trim()).join('\n'))}</textarea><small class="muted">Mit * am Ende wird eine Zutat nicht auf die Einkaufsliste übernommen, z. B. 1 TL Salz *.</small><label>Zubereitung</label><textarea name="instructions" rows="7" placeholder="So wird das Gericht zubereitet …">${esc(r?.instructions||'')}</textarea><label>Internetlink (optional)</label><input name="source_url" type="url" placeholder="https://..." value="${esc(r?.source_url||'')}"><div class="spacer"></div><button type="submit">Rezept speichern</button></form></div>`)}
function parseRecipeIngredients(text){return text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(line=>{let m=line.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|EL|TL|Stück|Stk\.?|Prise|Packung|Pck\.?|Dose|Dosen)?\s+(.+)$/i);return m?{ingredient:m[3].trim(),quantity:Number(m[1].replace(',','.')),unit:m[2]||null}:{ingredient:line,quantity:null,unit:null}})}
async function compactRecipeImage(file){if(!file)return null;if(file.size>12*1024*1024)throw Error('Bitte ein Foto unter 12 MB wählen.');let bitmap=await createImageBitmap(file),scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return canvas.toDataURL('image/jpeg',.65)}
async function saveRecipeEditor(e,id){e.preventDefault();let f=e.target,btn=f.querySelector('button[type="submit"]');btn.disabled=true;try{let payload={title:f.elements.title.value.trim(),category:f.elements.category.value,portions:Number(f.elements.portions.value),prep_minutes:f.elements.prep_minutes.value?Number(f.elements.prep_minutes.value):null,season:f.elements.season.value,instructions:f.elements.instructions.value.trim()||null,source_url:f.elements.source_url.value.trim()||null};let file=f.elements.photo.files[0];if(file)payload.photo_data=await compactRecipeImage(file);let q=id?client.from('recipes').update(payload).eq('id',id).eq('household_id',household):client.from('recipes').insert({household_id:household,...payload});let {data,error}=await q.select('id').single();if(error)throw error;let parsed=parseRecipeIngredients(f.elements.ingredients.value);let old=cache.ingredients.filter(x=>x.recipe_id===data.id);let {error:delErr}=await client.from('recipe_ingredients').delete().eq('household_id',household).eq('recipe_id',data.id);if(delErr)throw delErr;if(parsed.length){let {error:insErr}=await client.from('recipe_ingredients').insert(parsed.map(i=>({household_id:household,recipe_id:data.id,...i})));if(insErr)throw insErr}toast('Rezept gespeichert');recipes('list')}catch(err){toast('Speichern fehlgeschlagen: '+err.message);btn.disabled=false}}
function quickRecipe(id){let r=cache.recipes.find(x=>x.id===id);if(!r)return;let week=nextMealFriday(),days=Array.from({length:7},(_,i)=>shiftISO(week,i));render(back()+`<h2>🗓 Rezept einplanen</h2><div class="card"><strong>${esc(r.title)}</strong><p class="muted">Woche ${formatDateDE(week)} – ${formatDateDE(days[6])}</p><div class="stack">${days.map(d=>{let existing=cache.mealPlan.find(m=>m.meal_date===d),other=cache.recipes.find(x=>x.id===existing?.recipe_id);return `<button class="recipe-day-choice" onclick="assignRecipeDay('${id}','${d}')"><span>${new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short'})} · ${formatDateDE(d)}</span><small>${esc(other?.title||'Noch frei')}</small><b>＋</b></button>`}).join('')}</div></div>`)}
async function assignRecipeDay(id,d){let existing=cache.mealPlan.find(x=>x.meal_date===d);if(existing&&!await appConfirm('Das vorhandene Gericht an diesem Tag ersetzen?','Gericht ersetzen?'))return;await saveMealRecord(d,id,existing?.portions||cache.recipes.find(x=>x.id===id)?.portions||2,existing?.dessert||null)}
async function saveMealRecord(d,id,portions,dessert){let existing=cache.mealPlan.find(x=>x.meal_date===d),q=existing?client.from('meal_plan').update({recipe_id:id,portions,dessert}).eq('id',existing.id).eq('household_id',household):client.from('meal_plan').insert({household_id:household,meal_date:d,recipe_id:id,portions,dessert});let {error}=await q;if(error)toast(error.message);else{toast('Gericht eingeplant');window.mealWeek=fridayWeek(d);recipes('week')}}
function mealDayForm(d){let m=cache.mealPlan.find(x=>x.meal_date===d);render(back()+`<h2>Gericht für ${formatDateDE(d)}</h2><div class="card"><form onsubmit="saveMealDay(event,'${d}')"><label>Rezept</label><select name="recipe" required>${cache.recipes.map(x=>`<option value="${x.id}" ${m?.recipe_id===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><label>Portionen</label><input name="portions" type="number" min="1" value="${m?.portions||2}" required><label>Dessert (optional)</label><input name="dessert" value="${esc(m?.dessert||'')}"><div class="spacer"></div><button>Speichern</button></form></div>`)}
async function saveMealDay(e,d){e.preventDefault();let f=e.target;await saveMealRecord(d,f.elements.recipe.value,Number(f.elements.portions.value),f.elements.dessert.value.trim()||null)}
async function randomMeal(d){let options=cache.recipes.filter(x=>!cache.mealPlan.some(m=>m.meal_date>=fridayWeek(d)&&m.meal_date<=shiftISO(fridayWeek(d),6)&&m.meal_date!==d&&m.recipe_id===x.id));if(!options.length)options=cache.recipes;if(!options.length){toast('Bitte zuerst ein Rezept speichern');return}let pick=options[Math.floor(Math.random()*options.length)];if(!await appConfirm('Zufallsvorschlag: '+pick.title+' – für '+formatDateDE(d)+' einplanen?','Rezeptvorschlag'))return;await assignRecipeDay(pick.id,d)}
function shoppingList(plan,rows,ingredients){let sums=new Map();for(let meal of plan){let r=rows.find(x=>x.id===meal.recipe_id);if(!r)continue;for(let i of ingredients.filter(x=>x.recipe_id===r.id)){let key=i.ingredient.trim().toLowerCase()+'|'+(i.unit||'').trim().toLowerCase(),qty=i.quantity==null?null:Number(i.quantity)*meal.portions/r.portions;if(!sums.has(key))sums.set(key,{name:i.ingredient,unit:i.unit||'',qty:0,hasQty:false});let v=sums.get(key);if(qty!=null){v.qty+=qty;v.hasQty=true}}}return [...sums.values()].map(x=>`<label style="display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)"><input type="checkbox" class="check" style="width:20px"> ${x.hasQty?Math.round(x.qty*100)/100+' ':''}${esc(x.unit)} ${esc(x.name)}</label>`).join('')||'<p class="muted">Die Einkaufsliste entsteht automatisch aus den eingeplanten Rezepten.</p>'}
async function addRecipe(e){e.preventDefault();let f=e.target;if(await insert('recipes',{title:f.title.value.trim(),category:f.category.value,portions:Number(f.portions.value),instructions:f.instructions.value.trim()||null,season:f.season.value,source_url:f.source_url.value.trim()||null}))recipes()}
async function addIngredient(e,id){e.preventDefault();let f=e.target;if(await insert('recipe_ingredients',{recipe_id:id,ingredient:f.ingredient.value.trim(),quantity:f.quantity.value?Number(f.quantity.value):null,unit:f.unit.value.trim()||null}))recipes()}
async function addMeal(e){e.preventDefault();let f=e.target;let {error}=await client.from('meal_plan').upsert({household_id:household,meal_date:f.date.value,recipe_id:f.recipe.value,portions:Number(f.portions.value)},{onConflict:'household_id,meal_date'});if(error)toast(error.message);else{toast('Wochenplan aktualisiert');recipes()}}
async function assets(){let [rows,maintenance]=await Promise.all([fetchRows('assets',null),fetchRows('maintenance','due_date')]);render(back()+`<h2>🚗 Fahrzeuge & Wartung</h2><div class="card"><h3>Fahrzeug oder Gerät hinzufügen</h3><form onsubmit="addAsset(event)"><label>Bezeichnung</label><input name="name" required placeholder="z. B. Auto, Anhänger, Rasenmäher"><label>Kennzeichen (optional)</label><input name="registration"><label>Notizen</label><textarea name="notes"></textarea><div class="spacer"></div><button>Speichern</button></form></div><div class="card"><h3>Wartung / TÜV eintragen</h3><form onsubmit="addMaintenance(event)"><label>Fahrzeug / Gerät</label><select name="asset" required><option value="">Bitte wählen</option>${rows.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><label>Was steht an?</label><input name="title" required placeholder="z. B. Hauptuntersuchung"><label>Fällig am</label><input type="date" lang="de-DE" name="due" required><label>Notizen</label><textarea name="notes"></textarea><div class="spacer"></div><button>Termin speichern</button></form></div><h3>Fälligkeiten</h3><div class="stack">${maintenance.map(x=>`<div class="item"><strong>${esc(x.title)}</strong><p class="muted">${esc(rows.find(a=>a.id===x.asset_id)?.name||'Gerät')} · ${esc(formatDateDE(x.due_date))}</p>${x.notes?`<p>${esc(x.notes)}</p>`:''}<button class="danger small" onclick="deleteAndRefresh('maintenance','${x.id}','assets')">Löschen</button></div>`).join('')||'<p class="muted">Noch keine Wartungstermine.</p>'}</div><h3>Meine Fahrzeuge & Geräte</h3><div class="stack">${rows.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><p class="muted">${esc(x.registration||'')} ${esc(x.notes||'')}</p><button class="danger small" onclick="deleteAndRefresh('assets','${x.id}','assets')">Löschen</button></div>`).join('')||'<p class="muted">Noch keine Geräte.</p>'}</div>`)}

async function importWasteCalendar(file){
 if(!file)return;
 let raw=await file.text(),blocks=raw.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1),entries=[];
 for(const b of blocks){let field=k=>{let line=b.split('\n').find(x=>x.startsWith(k+':')||x.startsWith(k+';'));return line?line.slice(line.indexOf(':')+1).trim():''};let name=field('SUMMARY'),date=field('DTSTART').slice(0,8),uid=field('UID');if(!/^(Restmüll|Bioabfall|Papier|Gelbe Tonne)/i.test(name)||!/^[0-9]{8}$/.test(date)||!uid)continue;let iso=date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8);entries.push({household_id:household,title:name,starts_at:iso+'T12:00:00Z',notes:'WBC-Abfallkalender · '+iso,apple_event_uid:'wbc-'+uid})}
 if(!entries.length){toast('Keine passenden Abfuhrtermine gefunden');return}
 let {data:existing,error:readError}=await client.from('calendar_events').select('apple_event_uid').eq('household_id',household).like('apple_event_uid','wbc-%');if(readError){toast(readError.message);return}
 let ids=new Set((existing||[]).map(x=>x.apple_event_uid)),fresh=entries.filter(x=>!ids.has(x.apple_event_uid));if(!fresh.length){toast('Alle Abfuhrtermine sind bereits vorhanden');return}
 let {error}=await client.from('calendar_events').insert(fresh);if(error){toast('Import fehlgeschlagen: '+error.message);return}toast(fresh.length+' Abfuhrtermine importiert');calendar()
}
async function addEvent(e){e.preventDefault();let f=e.target;if(f.end.value&&f.end.value<f.start.value){toast('Das Ende muss nach dem Beginn liegen');return}if(await insert('calendar_events',{title:f.title.value.trim(),starts_at:new Date(f.start.value).toISOString(),ends_at:f.end.value?new Date(f.end.value).toISOString():null,notes:f.notes.value.trim()||null}))calendar()}

const shoppingIcons=[[/milch|sahne|buttermilch/i,'🥛'],[/brot|brötchen|toast|baguette/i,'🍞'],[/käse|gouda|mozzarella/i,'🧀'],[/schinken|wurst|salami/i,'🥓'],[/\bei\b|eier/i,'🥚'],[/apfel|äpfel/i,'🍎'],[/banane/i,'🍌'],[/tomate/i,'🍅'],[/joghurt|quark/i,'🥣'],[/butter/i,'🧈'],[/kartoffel/i,'🥔'],[/karotte|möhre/i,'🥕'],[/salat/i,'🥬'],[/gurke/i,'🥒'],[/paprika/i,'🫑'],[/zwiebel/i,'🧅'],[/reis/i,'🍚'],[/nudel|pasta|spaghetti/i,'🍝'],[/fleisch|steak/i,'🥩'],[/hähnchen|huhn/i,'🍗'],[/fisch|lachs/i,'🐟'],[/wasser|limonade|cola/i,'🥤'],[/kaffee/i,'☕'],[/tee/i,'🫖'],[/bier/i,'🍺'],[/wein/i,'🍷'],[/saft/i,'🧃'],[/toilettenpapier|klopapier|küchenrolle/i,'🧻'],[/seife|spülmittel|shampoo|reiniger/i,'🧴'],[/zahnpasta/i,'🪥'],[/waschmittel/i,'🧺'],[/mehl/i,'🌾'],[/zucker/i,'🍬'],[/salz/i,'🧂'],[/honig/i,'🍯'],[/marmelade/i,'🍓'],[/schokolade/i,'🍫'],[/keks/i,'🍪'],[/obst/i,'🍇'],[/gemüse/i,'🥦']];

function parseShoppingInput(raw){let text=raw.trim().replace(/\s+/g,' '),quantity=null,unit=null;const num='(\\d+(?:[.,]\\d+)?)',units='(kg|g|l|liter|ml|stück|stk\\.?|packungen?|pakete?|flaschen?|dosen?)';let re1=new RegExp('^'+num+'\\s*(?:x\\s*)?'+units+'\\s+(.+)$','i'),re2=new RegExp('^'+num+'\\s*x\\s+(.+)$','i'),re3=new RegExp('^(.+?)\\s+'+num+'\\s*'+units+'$','i');let m;if((m=text.match(re1))){quantity=Number(m[1].replace(',','.'));unit=m[2];text=m[3]}else if((m=text.match(re2))){quantity=Number(m[1].replace(',','.'));unit='Stück';text=m[2]}else if((m=text.match(re3))){quantity=Number(m[2].replace(',','.'));unit=m[3];text=m[1]}else if((m=text.match(new RegExp('^'+num+'\\s+(.+)$','i')))){quantity=Number(m[1].replace(',','.'));unit='Stück';text=m[2]}else if((m=text.match(new RegExp('^(.+?)\\s+'+num+'$','i')))){quantity=Number(m[2].replace(',','.'));unit='Stück';text=m[1]}if(unit){unit=unit.toLowerCase().replace(/^liter$/,'l').replace(/^stk\\.?$/,'Stück').replace(/^stück$/,'Stück')}return {name:text.trim(),quantity,unit}}
async function shopping(showArchive=false){
 const [lists,items]=await Promise.all([fetchRows('shopping_lists'),fetchRows('shopping_items')]);
 cache.shoppingLists=lists;cache.shoppingItems=items;
 const selected=lists.filter(l=>showArchive?l.status==='archived':l.status==='active');
 if(activeShoppingId){let l=lists.find(x=>x.id===activeShoppingId);if(l){renderShoppingDetail(l,items.filter(i=>i.list_id===l.id));return}activeShoppingId=null}
 render(back()+`<div class="shop-head"><h2>🛒 Einkaufslisten</h2>${!showArchive?`<button class="shop-add" onclick="toggleShoppingCreate()">＋ Neue Liste</button>`:''}</div>${!showArchive?`<div id="shop-create" class="card shop-new-form hidden"><h3>Neue Einkaufsliste</h3><form onsubmit="createShoppingList(event)"><input name="title" placeholder="z. B. Wocheneinkauf" required><div class="actions"><button>Liste anlegen</button></div></form></div>`:''}<div class="shop-notes">${selected.map(l=>{let its=items.filter(i=>i.list_id===l.id),open=its.filter(i=>!i.checked).length;return `<button class="shop-note" onclick="openShoppingList('${l.id}')"><span class="note-symbol">${shoppingListIcon(l.title)}</span><strong>${esc(l.title)}</strong><small>${open} ${open===1?'Artikel':'Artikel'}${showArchive?' · erledigt':''}</small></button>`}).join('')}</div>${selected.length?'':'<p class="muted">Noch keine Listen vorhanden.</p>'}<button class="shop-archive" onclick="shopping(${!showArchive})"><span>🗃️ &nbsp; ${showArchive?'Aktive Einkaufslisten':'Erledigte Einkäufe'}<br><span class="shop-list-count">${lists.filter(l=>l.status===(showArchive?'active':'archived')).length} Listen</span></span><span>›</span></button>`);
}
function toggleShoppingCreate(){let el=$('#shop-create');if(el){el.classList.toggle('hidden');if(!el.classList.contains('hidden'))el.querySelector('input').focus()}}
function openShoppingList(id){activeShoppingId=id;shopping()}
function closeShoppingList(){activeShoppingId=null;shopping()}
function renderShoppingDetail(l,its){its.sort((a,b)=>Number(a.checked)-Number(b.checked)||(a.sort_order||0)-(b.sort_order||0));let pending=its.filter(i=>!i.checked),done=its.filter(i=>i.checked);let itemRow=i=>`<div class="shop-item ${i.checked?'done':''}" role="checkbox" tabindex="0" aria-checked="${i.checked}" aria-label="${esc(i.name)} ${i.checked?'erledigt':'abhaken'}" onclick="checkShoppingItem('${i.id}',${!i.checked})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();checkShoppingItem('${i.id}',${!i.checked})}"><input tabindex="-1" aria-hidden="true" class="check" type="checkbox" ${i.checked?'checked':''}><span class="product-icon">${shoppingIcon(i.name)}</span><span class="shop-name">${esc(i.name)}${i.quantity!=null||i.unit?`<span class="shop-qty">${esc([i.quantity,i.unit].filter(v=>v!==null&&v!==undefined&&v!=='').join(' '))}</span>`:''}</span>${l.status==='active'?`<button class="secondary delete-item" aria-label="${esc(i.name)} löschen" onclick="event.stopPropagation();deleteShoppingItem('${i.id}')">×</button>`:''}</div>`;
 render(`<div class="shop-detail-top"><button class="secondary small shop-back" onclick="closeShoppingList()">← Einkaufslisten</button></div><div class="shop-detail-note"><strong>${shoppingListIcon(l.title)} ${esc(l.title)}</strong><p>${its.length} Artikel · Gemeinsam mit Jana & Tom</p></div>${l.status==='active'?`<form class="shop-entry" onsubmit="addShoppingItem(event,'${l.id}')"><input name="shopping-entry" id="shopping-entry" autocomplete="off" autocorrect="off" aria-label="Artikel hinzufügen" placeholder="Artikel hinzufügen" required><button type="button" class="secondary shop-calendar" title="Wochenrezepte übernehmen" aria-label="Wochenrezepte übernehmen" onclick="shoppingFromWeek('${l.id}')">▦</button><button type="submit" aria-label="Artikel hinzufügen">＋</button></form>`:''}<div class="shop-section">Noch einkaufen (${pending.length})</div><div class="shop-item-grid">${pending.map(itemRow).join('')}</div>${pending.length?'':'<p class="muted">Alles erledigt!</p>'}${done.length?`<div class="shop-section">✓ Erledigte Artikel (${done.length})</div><div class="shop-item-grid">${done.map(itemRow).join('')}</div>`:''}<div class="shop-tools">${l.status==='active'?`<button class="secondary small" onclick="finishShoppingList('${l.id}')">✓ Einkauf abschließen</button>`:`<button class="secondary small" onclick="restoreShoppingList('${l.id}')">↩ Wieder aktivieren</button>`}</div>`);
}
async function createShoppingList(e){e.preventDefault();let title=e.target.title.value.trim();if(await insert('shopping_lists',{title,status:'active'})){activeShoppingId=null;shopping()}}
async function addShoppingItem(e,id){e.preventDefault();let f=e.target,raw=f.elements.namedItem('shopping-entry').value,parsed=parseShoppingInput(raw);if(!parsed.name){toast('Bitte Artikel eingeben');return}if(await insert('shopping_items',{list_id:id,...parsed}))shopping()}
async function checkShoppingItem(id,checked){if(!await update('shopping_items',id,{checked}))return;let item=cache.shoppingItems.find(x=>x.id===id),others=cache.shoppingItems.filter(x=>x.list_id===item.list_id&&x.id!==id);if(checked&&others.every(x=>x.checked)){await client.from('shopping_lists').update({status:'archived',completed_at:new Date().toISOString()}).eq('id',item.list_id).eq('household_id',household);toast('Einkauf automatisch archiviert');activeShoppingId=null}shopping()}
let lastShoppingDeletion=null;
function showShoppingUndo(){const el=$('#toast');el.innerHTML='Artikel gelöscht · <button type="button" id="shopping-undo" style="padding:4px 7px;margin-left:5px">Rückgängig</button>';el.style.display='block';clearTimeout(window._toast);el.querySelector('#shopping-undo').onclick=undoShoppingDelete;window._toast=setTimeout(()=>{el.style.display='none';lastShoppingDeletion=null},6000)}
async function deleteShoppingItem(id){const item=cache.shoppingItems.find(x=>x.id===id);if(!item)return;const {error}=await client.from('shopping_items').delete().eq('id',id).eq('household_id',household);if(error){toast('Löschen fehlgeschlagen: '+error.message);return}lastShoppingDeletion={household_id:household,list_id:item.list_id,name:item.name,quantity:item.quantity,unit:item.unit,checked:item.checked,sort_order:item.sort_order};await shopping();showShoppingUndo()}
async function undoShoppingDelete(){if(!lastShoppingDeletion)return;const entry=lastShoppingDeletion;lastShoppingDeletion=null;const {error}=await client.from('shopping_items').insert(entry);if(error){lastShoppingDeletion=entry;toast('Wiederherstellen fehlgeschlagen: '+error.message);return}toast('Artikel wiederhergestellt');await shopping()}
async function finishShoppingList(id){let pending=cache.shoppingItems.filter(x=>x.list_id===id&&!x.checked);if(pending.length){let transfer=await appConfirm(`${pending.length} Artikel sind noch offen. In eine neue Liste übernehmen?`,'Offene Artikel übernehmen?');if(transfer){let title='Offene Artikel · '+new Date().toLocaleDateString('de-DE');let {data,error}=await client.from('shopping_lists').insert({household_id:household,title,status:'active'}).select('id').single();if(error){toast(error.message);return}let {error:e}=await client.from('shopping_items').insert(pending.map(x=>({household_id:household,list_id:data.id,name:x.name,quantity:x.quantity,unit:x.unit,sort_order:x.sort_order})));if(e){toast(e.message);return}}}if(await update('shopping_lists',id,{status:'archived',completed_at:new Date().toISOString()})){activeShoppingId=null;shopping()}}
async function restoreShoppingList(id){if(await update('shopping_lists',id,{status:'active',completed_at:null})){activeShoppingId=null;shopping()}}
function fridayWeek(d){let date=new Date(d+'T12:00:00');let shift=(date.getDay()+2)%7;date.setDate(date.getDate()-shift);return date.toLocaleDateString('en-CA')}
async function shoppingFromWeek(listId){
 const target=cache.shoppingLists?.find(x=>x.id===listId&&x.status==='active');
 if(!target){toast('Bitte zuerst eine aktive Einkaufsliste öffnen');return}
 const start=upcomingShoppingFriday(),end=shiftISO(start,6);
 // Rezeptzutaten haben nicht zwingend ein created_at-Feld: niemals danach sortieren.
 const requests=await Promise.all([
  client.from('meal_plan').select('*').eq('household_id',household).gte('meal_date',start).lte('meal_date',end),
  client.from('recipes').select('*').eq('household_id',household),
  client.from('recipe_ingredients').select('*').eq('household_id',household),
  client.from('shopping_items').select('*').eq('household_id',household).eq('list_id',listId)
 ]);
 const error=requests.find(x=>x.error)?.error;
 if(error){toast('Zutaten konnten nicht geladen werden: '+error.message);return}
 const [plan,recipes,ingredients,existingItems]=requests.map(x=>x.data||[]);
 if(!plan.length){toast('Für '+formatDateDE(start)+' bis '+formatDateDE(end)+' sind keine Gerichte eingeplant.');return}
 const sums=new Map();let missing=0;
 for(const m of plan){
  const r=recipes.find(x=>x.id===m.recipe_id);
  if(!r){missing++;continue}
  const recipeIngredients=ingredients.filter(x=>x.recipe_id===r.id);
  if(!recipeIngredients.length){missing++;continue}
  for(const i of recipeIngredients){
   const name=(i.ingredient||'').trim();if(!name||/\*\s*$/.test(name))continue;
   const unit=(i.unit||'').trim();
   const key=name.toLocaleLowerCase('de-DE')+'|'+unit.toLocaleLowerCase('de-DE');
   const quantity=i.quantity==null?null:Number(i.quantity)*Number(m.portions||r.portions||1)/Number(r.portions||1);
   if(!sums.has(key))sums.set(key,{name,unit:unit||null,quantity:0,hasQuantity:false});
   const value=sums.get(key);
   if(quantity!=null&&Number.isFinite(quantity)){value.quantity+=quantity;value.hasQuantity=true}
  }
 }
 if(!sums.size){toast('Keine Zutaten gefunden. Bitte die eingeplanten Rezepte prüfen.');return}
 const existing=new Set(existingItems.map(i=>(i.name||'').trim().toLocaleLowerCase('de-DE')+'|'+(i.unit||'').trim().toLocaleLowerCase('de-DE')));
 const additions=[];
 for(const x of sums.values()){
  const key=x.name.toLocaleLowerCase('de-DE')+'|'+(x.unit||'').toLocaleLowerCase('de-DE');
  if(existing.has(key))continue;
  additions.push({household_id:household,list_id:listId,name:x.name,quantity:x.hasQuantity?Math.round(x.quantity*100)/100:null,unit:x.unit});
 }
 if(!additions.length){toast('Alle Zutaten stehen bereits auf dieser Einkaufsliste.');return}
 const {error:insertError}=await client.from('shopping_items').insert(additions);
 if(insertError){toast('Übernahme fehlgeschlagen: '+insertError.message);return}
 toast(additions.length+' Zutaten übernommen'+(missing?' · '+missing+' Rezepte ohne Zutaten':''));
 activeShoppingId=listId;await shopping();
}

let assetFilter='alle',assetSelected=null,assetTab='wartungen';
const assetKinds={auto:['🚗','Fahrzeug'],motorrad:['🏍️','Fahrzeug'],anhaenger:['🚛','Fahrzeug'],maschine:['🚜','Maschine'],geraet:['🔧','Gerät']};
const assetMoney=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const assetToday=()=>new Date().toLocaleDateString('en-CA');
const assetNum=(f,n)=>f.elements.namedItem(n)?.value.trim()?Number(f.elements.namedItem(n).value.replace(',','.')):null;
const assetVal=(f,n)=>f.elements.namedItem(n)?.value.trim()||null;
function assetIcon(a){return (assetKinds[a.asset_type]||assetKinds.geraet)[0]}
function assetCategory(a){return (assetKinds[a.asset_type]||assetKinds.geraet)[1]}
function assetDue(m,a){let today=assetToday(),d=m.due_date,days=d?Math.round((Date.parse(d+'T12:00:00Z')-Date.parse(today+'T12:00:00Z'))/86400000):null,remind=m.reminder_days??(/tüv|hauptuntersuchung/i.test(m.title)?30:14);let exceeded=(days!==null&&days<0)||(m.due_odometer_km!=null&&a.odometer_km!=null&&Number(a.odometer_km)>=Number(m.due_odometer_km))||(m.due_operating_hours!=null&&a.operating_hours!=null&&Number(a.operating_hours)>=Number(m.due_operating_hours));let soon=(days!==null&&days<=remind);return {cls:exceeded?'overdue':soon?'soon':'ok',label:exceeded?'Überfällig':soon?'Bald fällig':'Geplant'} }
function assetDueText(m){return [m.due_date&&formatDateDE(m.due_date),m.due_odometer_km!=null&&`${m.due_odometer_km} km`,m.due_operating_hours!=null&&`${m.due_operating_hours} Std.`].filter(Boolean).join(' oder ')||'Keine Fälligkeit'}
async function assets(){let [rows,maintenance,history,expenses]=await Promise.all([fetchRows('assets',null),fetchRows('maintenance','due_date'),fetchRows('maintenance_history',null),fetchRows('asset_expenses',null)]);cache.assets=rows;cache.maintenance=maintenance;cache.assetHistory=history;cache.assetExpenses=expenses;if(assetSelected&&!rows.some(x=>x.id===assetSelected))assetSelected=null;if(assetSelected)return assetDetail();let visible=rows.filter(a=>assetFilter==='alle'||(assetFilter==='fahrzeuge'?['auto','motorrad','anhaenger'].includes(a.asset_type):assetFilter==='maschinen'?a.asset_type==='maschine':a.asset_type==='geraet'));render(back()+`<div class="asset-top"><h2>🚗 Fahrzeuge & Maschinen</h2><button class="small" onclick="assetForm()">＋ Hinzufügen</button></div><div class="asset-filters">${[['alle','Alle'],['fahrzeuge','Fahrzeuge'],['maschinen','Maschinen'],['geraete','Geräte']].map(([id,label])=>`<button class="${assetFilter===id?'':'secondary'} small" onclick="assetFilter='${id}';assets()">${label}</button>`).join('')}</div><div class="asset-grid">${visible.map(a=>{let ms=maintenance.filter(m=>m.asset_id===a.id),alert=ms.map(m=>assetDue(m,a)).sort((x,y)=>({overdue:0,soon:1,ok:2}[x.cls]-{overdue:0,soon:1,ok:2}[y.cls]))[0];return `<button class="asset-card" onclick="assetSelected='${a.id}';assetTab='wartungen';assets()">${a.photo_data?`<img src="${esc(a.photo_data)}" alt="">`:`<span class="asset-icon">${assetIcon(a)}</span>`}<div class="asset-card-heading"><strong>${esc(a.name)}</strong><span class="asset-status-dot ${alert?.cls||'none'}" title="${alert?alert.label:'Keine Wartung geplant'}" aria-label="${alert?alert.label:'Keine Wartung geplant'}"></span></div><div class="asset-card-details"><span>${esc(a.manufacturer||assetCategory(a))}</span>${a.model?`<span>${esc(a.model)}</span>`:''}${a.registration?`<span class="asset-registration">${esc(a.registration)}</span>`:''}</div></button>`}).join('')}</div>${visible.length?'':'<p class="muted">Hier sind noch keine passenden Fahrzeuge oder Maschinen gespeichert.</p>'}`)}
function assetDetail(){let a=cache.assets.find(x=>x.id===assetSelected);if(!a){assetSelected=null;return assets()}let ms=cache.maintenance.filter(x=>x.asset_id===a.id),hs=cache.assetHistory.filter(x=>x.asset_id===a.id),es=cache.assetExpenses.filter(x=>x.asset_id===a.id);let total=[...hs,...es].reduce((s,x)=>s+Number(x.cost||0),0),annual=[...hs.map(x=>({cost:x.cost,date:x.completed_on})),...es.map(x=>({cost:x.cost,date:x.expense_on}))].filter(x=>x.date?.startsWith(String(new Date().getFullYear()))).reduce((s,x)=>s+Number(x.cost||0),0);let head=`<button class="secondary small" onclick="assetSelected=null;assets()">← Übersicht</button><div class="asset-top" style="margin-top:16px"><h2>${assetIcon(a)} ${esc(a.name)}</h2><button class="secondary small" onclick="assetForm('${a.id}')">Bearbeiten</button></div>${a.photo_data?`<img class="asset-photo" src="${esc(a.photo_data)}" alt="Fahrzeugfoto">`:''}<div class="asset-detail-tabs">${[['wartungen','Wartungen'],['kosten','Kosten'],['daten','Fahrzeug']].map(([t,l])=>`<button class="${assetTab===t?'':'secondary'}" onclick="assetTab='${t}';assetDetail()">${l}</button>`).join('')}</div>`;
if(assetTab==='wartungen')return render(head+`<button onclick="maintenanceForm()">＋ Wartung planen</button><div class="stack" style="margin-top:14px">${ms.map(m=>{let d=assetDue(m,a);return `<div class="card"><div class="asset-line"><div><strong>${esc(m.title)}</strong><small>${esc(assetDueText(m))}</small><span class="asset-status ${d.cls}">${d.label}</span></div><div class="actions"><button class="small" onclick="completeMaintenanceForm('${m.id}')">✓ Erledigt</button><button class="secondary small" onclick="maintenanceForm('${m.id}')">✎</button></div></div></div>`}).join('')||'<p class="muted">Noch keine Wartungen geplant.</p>'}</div><h3>Wartungshistorie</h3>${hs.sort((x,y)=>y.completed_on.localeCompare(x.completed_on)).map(h=>`<div class="asset-line"><div><strong>${esc(h.title)}</strong><small>${formatDateDE(h.completed_on)} · ${esc(h.notes||'')}</small></div><strong>${h.cost==null?'–':assetMoney(h.cost)}</strong></div>`).join('')||'<p class="muted">Noch keine erledigten Wartungen.</p>'}`);
if(assetTab==='kosten')return render(head+`<div class="asset-kpis"><div class="card"><small>Kosten ${new Date().getFullYear()}</small><strong>${assetMoney(annual)}</strong></div><div class="card"><small>Gesamtkosten</small><strong>${assetMoney(total)}</strong></div></div><div style="margin:16px 0"><button onclick="expenseForm()">＋ Ausgabe erfassen</button></div><h3>Ausgaben</h3>${es.sort((x,y)=>y.expense_on.localeCompare(x.expense_on)).map(x=>`<div class="asset-line"><div><strong>${esc(x.category)}</strong><small>${formatDateDE(x.expense_on)} · ${esc(x.notes||'')}</small></div><div class="actions"><strong>${assetMoney(x.cost)}</strong><button class="secondary small" onclick="expenseForm('${x.id}')">✎</button></div></div>`).join('')||'<p class="muted">Noch keine zusätzlichen Ausgaben.</p>'}<p class="asset-hint">Wartungskosten aus der Historie sind in den Summen enthalten. Kraftstoff wird nicht erfasst.</p>`);
return render(head+`<div class="card"><div class="asset-line"><span>Typ</span><strong>${assetCategory(a)}</strong></div>${[['Hersteller',a.manufacturer],['Modell',a.model],['Kennzeichen',a.registration],['Erstzulassung',a.first_registration&&formatDateDE(a.first_registration)],['Fahrgestellnummer',a.vin],['Seriennummer',a.serial_number],['Kilometerstand',a.odometer_km!=null?a.odometer_km+' km':null],['Betriebsstunden',a.operating_hours!=null?a.operating_hours+' Std.':null],['Notizen',a.notes]].filter(x=>x[1]).map(([k,v])=>`<div class="asset-line"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}<div style="margin-top:14px"><button class="secondary" onclick="assetReadingsForm()">Stand aktualisieren</button></div></div>`)}
function assetForm(id){let a=id?cache.assets.find(x=>x.id===id):null;render(`<button class="secondary small" onclick="assets()">← Zurück</button><h2>${a?'Fahrzeug bearbeiten':'Fahrzeug oder Maschine hinzufügen'}</h2><form class="card" onsubmit="saveAsset(event,'${id||''}')"><label>Bezeichnung</label><input name="name" required value="${esc(a?.name||'')}"><label>Typ</label><select name="type">${Object.entries(assetKinds).map(([k,v])=>`<option value="${k}" ${a?.asset_type===k?'selected':''}>${v[0]} ${k==='auto'?'Auto':k==='motorrad'?'Motorrad':k==='anhaenger'?'Anhänger':k==='maschine'?'Maschine':'Gerät'}</option>`).join('')}</select><div class="asset-form-grid">${[['manufacturer','Hersteller'],['model','Modell'],['registration','Kennzeichen'],['first_registration','Erstzulassung'],['vin','Fahrgestellnummer'],['serial_number','Seriennummer'],['odometer_km','Kilometerstand'],['operating_hours','Betriebsstunden']].map(([n,l])=>`<div><label>${l}</label><input name="${n}" type="${n==='first_registration'?'date':n==='odometer_km'||n==='operating_hours'?'number':'text'}" ${n==='odometer_km'||n==='operating_hours'?'min="0" step="any"':''} value="${esc(a?.[n]??'')}"></div>`).join('')}</div><label>Foto (optional)</label><input name="photo" type="file" accept="image/*"><p class="asset-hint">Das Foto wird verkleinert und mit dem Datensatz synchronisiert.</p><label>Notizen</label><textarea name="notes">${esc(a?.notes||'')}</textarea><div class="asset-form-actions"><button>Speichern</button></div></form>`)}
async function saveAsset(e,id){e.preventDefault();let f=e.target,p={name:assetVal(f,'name'),asset_type:assetVal(f,'type'),manufacturer:assetVal(f,'manufacturer'),model:assetVal(f,'model'),registration:assetVal(f,'registration'),first_registration:assetVal(f,'first_registration'),vin:assetVal(f,'vin'),serial_number:assetVal(f,'serial_number'),odometer_km:assetNum(f,'odometer_km'),operating_hours:assetNum(f,'operating_hours'),notes:assetVal(f,'notes')};let file=f.elements.namedItem('photo').files[0];if(file){if(file.size>12e6){toast('Foto zu groß (max. 12 MB)');return}try{p.photo_data=await resizeAssetPhoto(file)}catch(err){toast('Foto konnte nicht gelesen werden');return}}if(id){if(await update('assets',id,p)){assetSelected=id;assets()}}else if(await insert('assets',p)){assetSelected=null;assets()}}
function resizeAssetPhoto(file){return new Promise((resolve,reject)=>{let im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{let scale=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.68))};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Bildfehler'))};im.src=url})}
function assetReadingsForm(){let a=cache.assets.find(x=>x.id===assetSelected);render(`<button class="secondary small" onclick="assetDetail()">← Zurück</button><h2>Stand aktualisieren</h2><form class="card" onsubmit="saveAssetReadings(event)"><label>Kilometerstand</label><input name="km" type="number" min="0" step="any" value="${esc(a.odometer_km??'')}"><label>Betriebsstunden</label><input name="hours" type="number" min="0" step="any" value="${esc(a.operating_hours??'')}"><button>Speichern</button></form>`)}
async function saveAssetReadings(e){e.preventDefault();let p={odometer_km:assetNum(e.target,'km'),operating_hours:assetNum(e.target,'hours')};if(await update('assets',assetSelected,p))assets()}
function maintenanceForm(id){let m=id?cache.maintenance.find(x=>x.id===id):null;render(`<button class="secondary small" onclick="assetDetail()">← Zurück</button><h2>${m?'Wartung bearbeiten':'Wartung planen'}</h2><form class="card" onsubmit="saveMaintenance(event,'${id||''}')"><label>Wartung</label><input name="title" list="asset-services" oninput="if(!this.form.dataset.reminderEdited)this.form.elements.namedItem('reminder_days').value=/tüv|hauptuntersuchung/i.test(this.value)?30:14" required value="${esc(m?.title||'')}"><datalist id="asset-services"><option value="TÜV / Hauptuntersuchung"><option value="Ölwechsel"><option value="Inspektion"><option value="Jahreswartung"><option value="Reifenwechsel"></datalist><div class="asset-form-grid">${[['due_date','Fällig am','date'],['due_odometer_km','Fällig bei km','number'],['due_operating_hours','Fällig bei Stunden','number'],['repeat_every','Wiederholen alle Monate','number'],['repeat_km','Wiederholen alle km','number'],['repeat_hours','Wiederholen alle Stunden','number'],['reminder_days','Erinnerung (Tage vorher)','number']].map(([n,l,t])=>`<div><label>${l}</label><input name="${n}" type="${t}" ${t==='number'?'min="0" step="any"':''} value="${esc(m?.[n]??(n==='reminder_days'?'14':''))}"></div>`).join('')}</div><p class="asset-hint">Für TÜV kannst du die Erinnerung auf 30 Tage stellen. Bei km oder Stunden wird der letzte gespeicherte Stand geprüft.</p><div class="asset-form-actions"><button>Speichern</button></div></form>`)}
async function saveMaintenance(e,id){e.preventDefault();let f=e.target,p={asset_id:assetSelected,title:assetVal(f,'title'),due_date:assetVal(f,'due_date'),due_odometer_km:assetNum(f,'due_odometer_km'),due_operating_hours:assetNum(f,'due_operating_hours'),repeat_every:assetNum(f,'repeat_every'),repeat_unit:assetNum(f,'repeat_every')?'months':null,repeat_km:assetNum(f,'repeat_km'),repeat_hours:assetNum(f,'repeat_hours'),reminder_days:assetNum(f,'reminder_days')??14};if(!p.due_date&&p.due_odometer_km==null&&p.due_operating_hours==null){toast('Bitte eine Fälligkeit angeben');return}if(id?await update('maintenance',id,p):await insert('maintenance',p))assets()}
function completeMaintenanceForm(id){let m=cache.maintenance.find(x=>x.id===id),a=cache.assets.find(x=>x.id===m?.asset_id);if(!m||!a)return;render(`<button class="secondary small" onclick="assetDetail()">← Zurück</button><h2>${esc(m.title)} erledigen</h2><form class="card" onsubmit="saveCompletedMaintenance(event,'${id}')"><label>Durchgeführt am</label><input type="date" name="date" required value="${assetToday()}"><div class="asset-form-grid"><div><label>Kilometerstand</label><input name="km" type="number" min="0" value="${esc(a.odometer_km??'')}"></div><div><label>Betriebsstunden</label><input name="hours" type="number" min="0" step="any" value="${esc(a.operating_hours??'')}"></div></div><label>Kosten in € (optional)</label><input name="cost" inputmode="decimal" placeholder="0,00"><label>Notiz (optional)</label><textarea name="notes"></textarea><button>Wartung abschließen</button></form>`)}
async function saveCompletedMaintenance(e,id){e.preventDefault();let f=e.target,m=cache.maintenance.find(x=>x.id===id);if(!m)return;let km=assetNum(f,'km'),hours=assetNum(f,'hours'),cost=assetNum(f,'cost'),date=assetVal(f,'date');if(cost!=null&&(!Number.isFinite(cost)||cost<0)){toast('Ungültige Kosten');return}let h={asset_id:assetSelected,maintenance_id:id,title:m.title,completed_on:date,odometer_km:km,operating_hours:hours,cost,notes:assetVal(f,'notes')};if(!await insert('maintenance_history',h))return;await update('assets',assetSelected,{odometer_km:km,operating_hours:hours});let next={last_completed:date,last_completed_odometer_km:km,last_completed_operating_hours:hours,due_date:m.repeat_every?addMonthsISO(date,Number(m.repeat_every)):null,due_odometer_km:m.repeat_km&&km!=null?km+Number(m.repeat_km):null,due_operating_hours:m.repeat_hours&&hours!=null?hours+Number(m.repeat_hours):null};if(next.due_date||next.due_odometer_km!=null||next.due_operating_hours!=null){await update('maintenance',id,next)}else{let {error}=await client.from('maintenance').delete().eq('id',id).eq('household_id',household);if(error)toast(error.message)}assets()}
const expenseCategories=['Reparatur','Ersatzteile','Reifen','Versicherung','Steuer','Gebühren','Sonstiges'];
function expenseForm(id){let x=id?cache.assetExpenses.find(x=>x.id===id):null;render(`<button class="secondary small" onclick="assetDetail()">← Zurück</button><h2>${x?'Ausgabe bearbeiten':'Ausgabe erfassen'}</h2><form class="card" onsubmit="saveExpense(event,'${id||''}')"><label>Kategorie</label><select name="category">${expenseCategories.map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select><label>Datum</label><input type="date" name="date" required value="${esc(x?.expense_on||assetToday())}"><label>Betrag in €</label><input name="cost" inputmode="decimal" required value="${esc(x?.cost??'')}"><label>Notiz</label><textarea name="notes">${esc(x?.notes||'')}</textarea><button>Speichern</button></form>`)}
async function saveExpense(e,id){e.preventDefault();let f=e.target,p={asset_id:assetSelected,category:assetVal(f,'category'),expense_on:assetVal(f,'date'),cost:assetNum(f,'cost'),notes:assetVal(f,'notes')};if(p.cost==null||!Number.isFinite(p.cost)||p.cost<0){toast('Bitte gültigen Betrag eingeben');return}if(id?await update('asset_expenses',id,p):await insert('asset_expenses',p))assets()}

(async()=>{applyTheme('black_copper');if(!window.supabase){render('<div class="notice error">Die Supabase-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</div>');return}if(!initClient()){setup();return}await start()})();
</script></body></html>
