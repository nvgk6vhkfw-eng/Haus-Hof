\n/* V2.1 – einheitliches, ruhiges Design & iPhone-Bedienung */
:root{--hh-shadow:0 8px 24px rgba(0,0,0,.13)}

h2{font-size:20px;letter-spacing:-.35px}h3{font-size:16px;letter-spacing:-.1px}

/* Startseite */

.hh-today[open]>summary .hh-summary-icon,.hh-more[open]>summary .hh-summary-icon{transform:rotate(180deg)}

.hh-bottom-nav{position:fixed;z-index:60;bottom:0;left:0;right:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--panel) 94%,var(--bg));border-top:1px solid var(--line);box-shadow:0 -8px 24px #0004;padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.shop-item-grid{gap:6px}.shop-item-grid .shop-item{min-height:52px;padding:8px 7px;box-shadow:none}

let hhLiveChannel=null,hhLivePoll=null,hhLiveDebounce=null,hhLiveBusy=false,hhLivePending=false,hhLiveStatus='getrennt';
let hhLiveLastRefresh=null,hhLiveLastError='',hhBackupRestoreActive=false;
function hhLiveUpdateStatus(){const el=document.getElementById('hh-sync-state');if(el)el.textContent=navigator.onLine===false?'offline':hhLiveStatus;const detail=document.getElementById('hh-sync-detail');if(detail)detail.textContent=hhLiveLastError?'Letzter Fehler: '+hhLiveLastError:hhLiveLastRefresh?'Letzter erfolgreicher Abgleich: '+new Date(hhLiveLastRefresh).toLocaleString('de-DE'):'Noch kein Abgleich dieser Sitzung';}

const hhLiveTables=['tasks','task_completions','shopping_lists','shopping_items','meal_plan','recipes','recipe_ingredients','calendar_events','maintenance','maintenance_history','asset_expenses','assets','ideas'];
function hhLiveStop(){
 clearInterval(hhLivePoll);clearTimeout(hhLiveDebounce);hhLivePoll=null;hhLiveDebounce=null;hhLivePending=false;
 if(hhLiveChannel&&client){try{client.removeChannel(hhLiveChannel)}catch(e){}}
 hhLiveChannel=null;hhLiveStatus='getrennt';hhLiveUpdateStatus();
}
function hhLiveStart(){
 hhLiveStop();if(!client||!household||!user)return;
 const scopedHousehold=household;
 try{
  let channel=client.channel('haus-hof-'+user.id.slice(0,8)+'-'+Date.now());
  for(const table of hhLiveTables){channel=channel.on('postgres_changes',{event:'*',schema:'public',table,filter:'household_id=eq.'+scopedHousehold},payload=>{
   if(table==='recipes'){const id=payload?.new?.id||payload?.old?.id;if(id)hhRecipePhotos.delete(id);}
   if(household===scopedHousehold)hhLiveRequestRefresh();
  });}
  hhLiveChannel=channel;
  channel.subscribe(status=>{
   if(household!==scopedHousehold)return;
   hhLiveStatus=status==='SUBSCRIBED'?'verbunden':status==='CHANNEL_ERROR'||status==='TIMED_OUT'?'Wiederabgleich':'Verbindung wird hergestellt';
   hhLiveUpdateStatus();
   // Die Seite wurde gerade geladen; hier kein redundanter Vollabgleich.
  });
 }catch(e){hhLiveStatus='Wiederabgleich';hhLiveLastError=String(e?.message||e);hhLiveUpdateStatus();}
 // Auch bei ausgeschaltetem Realtime oder Netzunterbrechungen werden offene Ansichten aktualisiert.
 hhLivePoll=setInterval(()=>hhLiveRequestRefresh(),60000);
}
// Bei einem automatischen Abgleich nicht versehentlich ungespeicherte Formulare verwerfen.
// Auch nach Verlassen des Eingabefeldes bleibt das Formular markiert, bis es geschlossen wurde.
document.addEventListener('input',hhLiveMarkDirty,true);
document.addEventListener('change',hhLiveMarkDirty,true);
function hhLiveMarkDirty(event){
 const form=event.target?.closest?.('#app form');
 if(form&&event.isTrusted)form.dataset.hhDirty='1';
}
function hhLiveHasDraft(){
 if(hhBackupRestoreActive||document.getElementById('hh-restore-panel'))return true;
 if(document.querySelector('#app form[data-hh-dirty="1"]'))return true;
 if(document.querySelector('.hh-modal-backdrop'))return true;
 if(document.querySelector('#hh-calendar-editor'))return true;
 const a=document.activeElement;
 if(a&&a.closest&&a.closest('#app')&&a.matches('input,textarea,select,[contenteditable="true"]'))return true;
 if(document.querySelector('#app details[open] form'))return true;
 return false;
}
function hhLiveRequestRefresh(){
 if(!household||!user||!client)return;
 hhLivePending=true;
 clearTimeout(hhLiveDebounce);
 hhLiveDebounce=setTimeout(hhLiveTryRefresh,700);
}
async function hhLiveTryRefresh(){
 if(!hhLivePending||hhLiveBusy||!household||!user||document.visibilityState==='hidden'||hhLiveHasDraft()||navigator.onLine===false)return false;
 hhLiveBusy=true;hhLivePending=false;
 const oldPage=page,oldHouse=household,oldScroll=window.scrollY;
 try{
  if(oldPage==='home')await home();
  else if(oldPage==='calendar'&&!document.querySelector('#hh-calendar-editor'))await calendar();
  else if(oldPage==='shopping')await shopping();
  else if(oldPage==='tasks'||oldPage==='yard'){
   if(!document.querySelector('#app form'))await tasks(oldPage);
  }else if(oldPage==='recipes'){
   if(document.getElementById('recipe-cards')||document.querySelector('.week-rows')||document.querySelector('.recipe-home'))await recipes(recipeTab);
  }else if(oldPage==='reminders')await reminders();
  // Andere Bereiche werden beim erneuten Öffnen ohnehin aus Supabase geladen.
  if(oldHouse===household&&oldPage===page)requestAnimationFrame(()=>window.scrollTo(0,oldScroll));
  hhLiveLastRefresh=new Date().toISOString();hhLiveLastError='';hhLiveUpdateStatus();return true;
 }catch(e){hhLiveStatus='Wiederabgleich';hhLiveLastError=String(e?.message||e);hhLiveUpdateStatus();return false;}
 finally{hhLiveBusy=false;if(hhLivePending)hhLiveDebounce=setTimeout(hhLiveTryRefresh,1100);}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')hhLiveRequestRefresh()});
window.addEventListener('online',()=>{hhLiveUpdateStatus();hhLiveRequestRefresh()});
window.addEventListener('offline',()=>{hhLiveStatus='offline';hhLiveUpdateStatus()});
document.addEventListener('focusout',()=>{if(hhLivePending)setTimeout(hhLiveTryRefresh,300)},true);
document.addEventListener('toggle',()=>{if(hhLivePending)setTimeout(hhLiveTryRefresh,250)},true);

async function hhLiveSyncNow(){
 if(navigator.onLine===false){toast('Offline: bitte Internetverbindung prüfen');hhLiveUpdateStatus();return;}
 if(hhLiveHasDraft()){toast('Bitte offene Eingaben erst speichern oder schließen');return;}
 if(hhLiveBusy){toast('Abgleich läuft bereits');return;}
 // Die Verbindungsprobe liefert ein echtes Serverergebnis, auch wenn Einstellungen geöffnet sind.
 try{
  const {error}=await client.from('household_members').select('household_id').eq('user_id',user.id).limit(1);
  if(error)throw error;
  hhLivePending=true;
  const success=await hhLiveTryRefresh();
  if(success){toast('Daten erfolgreich abgeglichen');}
  else{toast('Abgleich konnte nicht abgeschlossen werden');}
 }catch(e){hhLiveLastError=String(e?.message||e);hhLiveUpdateStatus();toast('Abgleich fehlgeschlagen: '+hhLiveLastError);}
}
function go(p){if(p!=='shopping')activeShoppingId=null;page=p;editing=null;if(p==='home')home();else if(p==='settings')settings();else if(p==='tasks'||p==='yard')tasks(p);else if(p==='recipes')recipes();else if(p==='shopping')shopping();else if(p==='ideas')ideas();else if(p==='assets')assets();else if(p==='calendar')calendar();else if(p==='reminders')reminders()}
let hhStartupOpening=false;

 if(hhStartupOpening){
  hhStartupOpening=false;
  const quick=modules.map(m=>`<button class="tile" onclick="go('${m[0]}')"><span class="emoji">${m[1]}</span><span><strong>${m[2]}</strong></span></button>`).join('');
  render(`<p class="muted home-greeting">Hallo ${esc(memberNames[user.id]||'ihr zwei')} 👋</p><div class="today-heading">Heute im Überblick</div><div class="today-card" style="padding:13px;color:var(--muted)">Termine, Aufgaben und Essen werden geladen …</div><div class="today-heading">Unsere Bereiche</div><div class="grid home-tiles">${quick}</div>`);
 }

 const thisHousehold=household;
 const order=Array.isArray(prefs.tile_layout)&&prefs.tile_layout.length?prefs.tile_layout:modules.map(m=>m[0]);
 const ordered=[...modules].sort((a,b)=>(order.includes(a[0])?order.indexOf(a[0]):100+modules.findIndex(m=>m[0]===a[0]))-(order.includes(b[0])?order.indexOf(b[0]):100+modules.findIndex(m=>m[0]===b[0])));
 const today=new Date().toLocaleDateString('en-CA');
 const now=new Date().toISOString();
 const [tasksResult,eventsResult,mealResult,maintenanceResult,allTasksResult,wasteResult,shoppingResult,assetsResult]=await Promise.all([
  client.from('tasks').select('title,due_date,category,completed_at').eq('household_id',thisHousehold).is('completed_at',null).not('due_date','is',null).order('due_date',{ascending:true}).limit(1),
  client.from('calendar_events').select('title,starts_at').eq('household_id',thisHousehold).gte('starts_at',now).order('starts_at',{ascending:true}).limit(1),
  client.from('meal_plan').select('recipe_id,portions').eq('household_id',thisHousehold).eq('meal_date',today).maybeSingle(),
  client.from('maintenance').select('title,due_date,asset_id').eq('household_id',thisHousehold).gte('due_date',today).order('due_date').limit(1),
  client.from('tasks').select('category,completed_at').eq('household_id',thisHousehold).is('completed_at',null),
  client.from('calendar_events').select('title,starts_at').eq('household_id',thisHousehold).gte('starts_at',now).like('apple_event_uid','wbc-%').order('starts_at').limit(1),
  client.from('shopping_lists').select('id').eq('household_id',thisHousehold).eq('status','active'),
  client.from('assets').select('id,name').eq('household_id',thisHousehold)
 ]);
 if(page!=='home'||household!==thisHousehold)return;
 let task=tasksResult.data?.[0],event=eventsResult.data?.[0],meal=mealResult.data,mealTitle=null;
 if(meal?.recipe_id){let r=await client.from('recipes').select('title').eq('household_id',thisHousehold).eq('id',meal.recipe_id).maybeSingle();mealTitle=r.data?.title||null}
 if(page!=='home'||household!==thisHousehold)return;
 const dateLabel=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
 const taskDate=task?.due_date?new Date(task.due_date+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):'';
 const eventDate=event?new Date(event.starts_at).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
 const line=(icon,label,value,meta,target,extraClass='')=>`<button class="today-line ${extraClass}" onclick="go('${target}')"><span class="today-icon">${icon}</span><span class="today-content"><span class="today-label">${label}</span><span class="today-value">${esc(value)}</span>${meta?`<span class="today-meta">${esc(meta)}</span>`:''}</span><span class="today-arrow">›</span></button>`;
 const overview=`<div class="today-card">${line('✓','Nächste Aufgabe',task?.title||'Keine fälligen Aufgaben',task?(task.due_date<today?'Überfällig · ':task.due_date===today?'Heute · ':'Fällig am ')+taskDate:'',task?.category==='hof'?'yard':'tasks')}${line('▦','Nächster Termin',event?.title||'Kein anstehender Termin',eventDate,'calendar')}${line('♨','Heute gibt es',mealTitle||'Noch kein Essen geplant',mealTitle?meal.portions+' Portionen':'','recipes')}${maintenanceResult.data?.[0]?line('🔧','Nächste Wartung',maintenanceResult.data[0].title,`${(assetsResult.data||[]).find(a=>a.id===maintenanceResult.data[0].asset_id)?.name||'Fahrzeug / Maschine'} · ${formatDateDE(maintenanceResult.data[0].due_date)}`,'assets','hh-maintenance-today'):''}${wasteResult.data?.[0]?line('🗑','Nächste Müllabfuhr',wasteResult.data[0].title,new Date(wasteResult.data[0].starts_at).toLocaleDateString('de-DE'),'calendar'):''}</div>`;
 render(`<p class="muted home-greeting">Hallo ${esc(memberNames[user.id]||'ihr zwei')} 👋 · ${esc(dateLabel)}</p>${overview}<div class="today-heading">Unsere Bereiche</div><div class="grid home-tiles">${ordered.map(m=>`<button class="tile" onclick="go('${m[0]}')"><span class="emoji">${m[1]}</span><span><strong>${m[2]}</strong><br><small>${m[3]}</small>${['tasks','yard'].includes(m[0])?`<span class="tile-count" onclick="event.stopPropagation();go('${m[0]}')">${(allTasksResult.data||[]).filter(t=>t.category===(m[0]==='yard'?'hof':'haushalt')).length||''}</span>`:m[0]==='shopping'&&shoppingResult.data?.length?`<span class="tile-count" onclick="event.stopPropagation();go('shopping')">${shoppingResult.data.length}</span>`:''}</span></button>`).join('')}</div>`);
 if(tasksResult.error||eventsResult.error||mealResult.error)toast('Tagesübersicht konnte teilweise nicht geladen werden');
}
function settings(){render(back()+`<h2>Einstellungen</h2><div class="card"><h3>Mein Design</h3><label>Farbthema</label><select id="theme" onchange="changeTheme(this.value)">${Object.entries(themeNames).map(([k,v])=>`<option value="${k}" ${prefs.theme===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="card"><h3>Meine Kacheln</h3><p class="muted">Die Kacheln auf der Startseite folgen dieser Reihenfolge.</p><div class="stack">${[...new Set([...(prefs.tile_layout?.length?prefs.tile_layout:modules.map(x=>x[0])),...modules.map(x=>x[0])])].map((id,i)=>{let m=modules.find(x=>x[0]===id);return m?`<div class="row item"><span>${m[1]} ${m[2]}</span><span><button class="small secondary" onclick="moveTile(${i},-1)">↑</button> <button class="small secondary" onclick="moveTile(${i},1)">↓</button></span></div>`:''}).join('')}</div></div><div class="card"><h3>Erinnerungen</h3><label class="row" style="align-items:center;gap:12px"><input type="checkbox" style="width:auto" ${prefs.push_preferences?.muell!==false?'checked':''} onchange="setWasteReminder(this.checked)"><span>Müllabfuhr am Vorabend um 18:00 Uhr erinnern</span></label><p class="muted">Die Einstellung wird pro Benutzer gespeichert. Automatische Push-Nachrichten müssen noch technisch eingerichtet werden.</p></div><div class="card"><h3>🔔 Fälligkeiten in der App</h3><p class="muted">Die Hinweise erscheinen beim Öffnen der App. Automatische Push-Nachrichten bei geschlossener App sind noch nicht eingerichtet.</p><label>Aufgaben anzeigen ab</label><select onchange="setReminderPreference('task_lead_days',Number(this.value))">${[3,7,14,30].map(n=>`<option value="${n}" ${Number(prefs.push_preferences?.task_lead_days??7)===n?'selected':''}>${n} Tage vorher</option>`).join('')}</select><label class="row" style="align-items:center;gap:10px"><input type="checkbox" style="width:auto" ${prefs.push_preferences?.task_reminders!==false?'checked':''} onchange="setReminderPreference('task_reminders',this.checked)"><span>Aufgaben in Erinnerungen anzeigen</span></label><label class="row" style="align-items:center;gap:10px"><input type="checkbox" style="width:auto" ${prefs.push_preferences?.maintenance_reminders!==false?'checked':''} onchange="setReminderPreference('maintenance_reminders',this.checked)"><span>Wartungen und TÜV anzeigen</span></label><button class="secondary small" onclick="go('reminders')">🔔 Zur Erinnerungsübersicht</button></div><div class="card"><h3>💾 Datensicherung</h3><p class="muted">Sichere eure gemeinsamen Haus-&-Hof-Daten inklusive Rezeptbildern als Datei auf deinem Gerät. Die automatische Supabase-Speicherung bleibt unverändert.</p><div class="actions"><button onclick="hhBackupDownload()" id="hh-backup-download">⬇ Sicherung herunterladen</button><button class="secondary" onclick="hhBackupOpenRestore()">↥ Sicherung wiederherstellen</button></div><p class="muted" style="font-size:12px">Wiederherstellung nur im selben Haushalt. Vor dem Wiederherstellen werden alle Zieltabellen geprüft; vorhandene Einträge bleiben unverändert. Sicherungsdateien enthalten private Haushaltsdaten. Bitte geschützt aufbewahren und möglichst nicht gleichzeitig von zwei Handys aus wiederherstellen.</p><div id="hh-backup-status" role="status" aria-live="polite"></div></div><div class="card"><h3>Benutzerkonto</h3><p class="muted">${esc(user.email)}</p><button class="secondary" onclick="signOut()">Abmelden</button></div><div class="card"><h3>Verbindung & Synchronisierung</h3><p class="muted">Supabase: angemeldet. Gemeinsame Änderungen werden per Echtzeitkanal und regelmäßigem Wiederabgleich geladen. Status: <span id="hh-sync-state">${esc(hhLiveStatus)}</span>.</p><p class="muted">Bei geschlossenem Browser oder ohne Internet werden keine neuen Änderungen empfangen. Die Einstellungen für Echtzeitbenachrichtigungen müssen in Supabase für die verwendeten Tabellen aktiviert sein.</p><p class="muted" id="hh-sync-detail" style="font-size:12px">${esc(hhLiveLastError?'Letzter Fehler: '+hhLiveLastError:hhLiveLastRefresh?'Letzter erfolgreicher Abgleich: '+new Date(hhLiveLastRefresh).toLocaleString('de-DE'):'Noch kein Abgleich dieser Sitzung')}</p><button class="secondary small" onclick="hhLiveSyncNow()">Jetzt abgleichen</button></div>`)}
function setReminderPreference(k,value){prefs.push_preferences={...(prefs.push_preferences||{}),[k]:value};savePrefs();toast('Erinnerungseinstellung gespeichert')}
function setWasteReminder(on){prefs.push_preferences={...(prefs.push_preferences||{}),muell:on};savePrefs();toast(on?'Müllerinnerung eingeschaltet':'Müllerinnerung ausgeschaltet')}
function changeTheme(t){prefs.theme=t;applyTheme(t);savePrefs()}
function moveTile(i,d){let a=[...new Set([...(prefs.tile_layout?.length?prefs.tile_layout:modules.map(x=>x[0])),...modules.map(x=>x[0])])],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];prefs.tile_layout=a;savePrefs();settings()}
async function fetchRows(table,order='created_at'){let q=client.from(table).select('*').eq('household_id',household);if(order)q=q.order(order,{ascending:order==='due_date'||order==='meal_date'||order==='starts_at'});let {data,error}=await q;if(error){toast('Datenfehler: '+error.message);return []}return data||[]}
async function insert(table,values){let {error}=await client.from(table).insert({household_id:household,...values});if(error){toast(error.message);return false}toast('Gespeichert');return true}
async function update(table,id,values){let {error}=await client.from(table).update(values).eq('id',id).eq('household_id',household);if(error){toast(error.message);return false}toast('Aktualisiert');return true}
function appConfirm(message,title='Bitte bestätigen',danger=false){return new Promise(resolve=>{const layer=document.createElement('div');layer.className='hh-modal-backdrop';layer.innerHTML=`<div class="hh-modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(message)}</p><div class="actions"><button type="button" class="secondary" data-choice="no">Abbrechen</button><button type="button" class="${danger?'danger-confirm':''}" data-choice="yes">${danger?'Löschen':'Bestätigen'}</button></div></div>`;document.body.appendChild(layer);const finish=value=>{document.removeEventListener('keydown',key);layer.remove();resolve(value)};const key=e=>{if(e.key==='Escape')finish(false)};document.addEventListener('keydown',key);layer.querySelector('[data-choice=no]').onclick=()=>finish(false);layer.querySelector('[data-choice=yes]').onclick=()=>finish(true);layer.addEventListener('click',e=>{if(e.target===layer)finish(false)})})}
function localISO(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function upcomingShoppingFriday(){const today=new Date();today.setHours(12,0,0,0);const days=(5-today.getDay()+7)%7;today.setDate(today.getDate()+days);return localISO(today)}
async function remove(table,id){if(!await appConfirm('Möchtest du diesen Eintrag wirklich dauerhaft löschen?','Eintrag löschen?',true))return false;let {error}=await client.from(table).delete().eq('id',id).eq('household_id',household);if(error){toast(error.message);return false}toast('Gelöscht');return true}
const taskRoute=c=>c==='hof'?'yard':'tasks';
const repeatLabels={none:'Keine Wiederholung',fixed_week:'Wöchentlich (fester Termin)',fixed_month:'Monatlich (fester Termin)',fixed_year:'Jährlich (fester Termin)',after_days:'Tage nach Erledigung',after_weeks:'Wochen nach Erledigung',after_months:'Monate nach Erledigung'};
function addMonthsISO(iso,n){let [y,m,d]=iso.split('-').map(Number),first=new Date(Date.UTC(y,m-1+n,1)),last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();return `${first.getUTCFullYear()}-${String(first.getUTCMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}
function shiftISO(iso,days){let d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function nextDue(x,when){let r=x.repeat_type||'none',n=Math.max(1,Number(x.repeat_interval)||1),base=x.due_date||when;if(r==='none')return null;if(r==='after_days')return shiftISO(when,n);if(r==='after_weeks')return shiftISO(when,7*n);if(r==='after_months')return addMonthsISO(when,n);let next=base;for(let i=0;i<1000;i++){next=r==='fixed_week'?shiftISO(next,7*n):addMonthsISO(next,(r==='fixed_year'?12:1)*n);if(next>when)return next}return next}
function recurrenceFields(x={}){let r=x.repeat_type||'none';return `<label>Wiederholung</label><select name="repeat_type" onchange="this.form.querySelector('.repeat-count').classList.toggle('hidden',this.value==='none')">${Object.entries(repeatLabels).map(([k,v])=>`<option value="${k}" ${r===k?'selected':''}>${v}</option>`).join('')}</select><div class="repeat-count ${r==='none'?'hidden':''}"><label>Alle wie viele Tage / Wochen / Monate / Jahre?</label><input name="repeat_interval" type="number" min="1" max="365" value="${Number(x.repeat_interval)||1}"></div>`}
function assignmentOptions(x={}){let a=x.assigned_to_both?'both':x.assigned_to||'';return `<option value="" ${!a?'selected':''}>Nicht zugewiesen</option><option value="both" ${a==='both'?'selected':''}>Beide</option>${Object.entries(memberNames).map(([id,n])=>`<option value="${id}" ${a===id?'selected':''}>${esc(n)}</option>`).join('')}`}

let hhTaskCalendarMonth=null;
function toggleTaskDatePicker(button){
 const calendar=button.nextElementSibling;
 if(!calendar)return;
 const opening=calendar.hidden;
 calendar.hidden=!opening;button.setAttribute('aria-expanded',String(opening));
 if(opening){const selected=button.previousElementSibling.value;const initial=selected&&/^\d{4}-\d{2}-\d{2}$/.test(selected)?new Date(selected+'T12:00:00'):new Date();hhTaskCalendarMonth=new Date(initial.getFullYear(),initial.getMonth(),1);drawTaskDatePicker(calendar)}
}
function shiftTaskDateMonth(el,direction){
 hhTaskCalendarMonth=new Date(hhTaskCalendarMonth.getFullYear(),hhTaskCalendarMonth.getMonth()+direction,1);
 drawTaskDatePicker(el.closest('.hh-inline-calendar'));
}
function selectTaskDate(el,iso){
 const calendar=el.closest('.hh-inline-calendar'),field=calendar.previousElementSibling.previousElementSibling;
 field.value=iso;calendar.previousElementSibling.querySelector('.hh-date-label').textContent=iso?formatDateDE(iso):'Datum auswählen';
 calendar.hidden=true;calendar.previousElementSibling.setAttribute('aria-expanded','false');
 field.dispatchEvent(new Event('change',{bubbles:true}));
}
function drawTaskDatePicker(calendar){
 if(!calendar||!hhTaskCalendarMonth)return;
 const y=hhTaskCalendarMonth.getFullYear(),m=hhTaskCalendarMonth.getMonth(),selected=calendar.previousElementSibling.previousElementSibling.value;
 const offset=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate(),today=localISO();

function hhLegacyTaskPayload(values){
 const v={...values},kind=v.repeat_type||'none',n=Math.max(1,Number(v.repeat_interval)||1);
 delete v.repeat_type;delete v.repeat_interval;
 const mapping={fixed_week:['weeks','fixed'],fixed_month:['months','fixed'],fixed_year:['years','fixed'],after_days:['days','completion'],after_weeks:['weeks','completion'],after_months:['months','completion']};

async function hhWriteTask(values,id=null){
 // Only try the legacy schema when PostgREST explicitly reports a missing
 // repeat_type/repeat_interval column. Other errors must not be hidden.
 const write=payload=>id
  ?client.from('tasks').update(payload).eq('id',id).eq('household_id',household)
  :client.from('tasks').insert({household_id:household,...payload});
 let result=await write(values);
 const message=String(result.error?.message||'');
 if(result.error&&/repeat_type|repeat_interval/.test(message)&&/could not find|does not exist|schema cache|column/i.test(message)){
  result=await write(hhLegacyTaskPayload(values));
 }

}

const cats={fleisch:'Fleisch',fisch:'Fisch',vegetarisch:'Vegetarisch',suppen:'Suppen & Eintöpfe',auflauf:'Aufläufe',pasta:'Pizza & Pasta',schnell:'Schnelle Gerichte',dessert:'Desserts'};

function cleanRecipeInstructions(v){return String(v||'').replace(/\s*\[HH_RECIPE_FAVORITE=YES\]/g,'').replace(/\s*\[HH_MAIN_COURSE=(?:YES|NO)\]/g,'').trim()}
async function toggleRecipeFavorite(id){
 const r=(cache.recipes||[]).find(x=>x.id===id);if(!r)return;

 // Reconstruct only the note/flag field. Never touch recipe ingredients or photos.
 const {error}=await client.from('recipes').update({instructions:changed}).eq('id',id).eq('household_id',household);
 if(error){toast('Favorit konnte nicht gespeichert werden: '+error.message);return}
 r.instructions=changed;
 const b=document.querySelector('[data-favorite-id="'+id+'"]');
 if(b){b.textContent=now?'♥':'♡';b.classList.toggle('is-favorite',now);b.setAttribute('aria-label',now?'Aus Favoriten entfernen':'Zu Favoriten hinzufügen');b.setAttribute('aria-pressed',String(now));}

function isMainRecipe(r){
 const s=String(r.instructions||'');
 if(/\[HH_MAIN_COURSE=YES\]\s*$/.test(s))return true;
 if(/\[HH_MAIN_COURSE=NO\]\s*$/.test(s))return false;
 const title=String(r.title||'').toLocaleLowerCase('de-DE');
 if(/dessert|tiramisu|creme|mousse|pudding|parfait|cheesecake|waffel|kuchen|keks|plätzchen|gebäck|spritz|cocktail|mocktail|bowle|limonade|drink|aperol|smoothie|giotto|spekulatius|bruschetta|salat|soße|sauce|dressing|dip|brotaufstrich/.test(title))return false;
 if(r.category==='dessert')return false;
 if(r.category==='suppen' && /zwiebel|vorspeisen/.test(title))return false;
 return ['fleisch','fisch','vegetarisch','suppen','auflauf','pasta','schnell'].includes(r.category);

async function hhFetchRecipePhotos(ids){

 if(fresh.length){

   const {data,error}=await client.from('recipes').select('id,photo_data').eq('household_id',currentHousehold).in('id',fresh);
   if(error)throw error;
   if(household!==currentHousehold)return;
   const found=new Map((data||[]).map(item=>[item.id,item.photo_data||null]));
   for(const id of fresh){const photo=found.get(id)||null;hhRecipePhotos.set(id,photo);const r=cache.recipes?.find(x=>x.id===id);if(r)r.photo_data=photo;}
   hhPaintRecipePhotos();
  })();
  fresh.forEach(id=>hhRecipePhotosInFlight.set(id,request));
  request.finally(()=>fresh.forEach(id=>hhRecipePhotosInFlight.delete(id))).catch(()=>{});
 }
 const requests=[...new Set(wanted.map(id=>hhRecipePhotosInFlight.get(id)).filter(Boolean))];
 if(requests.length)await Promise.all(requests);
}
function hhQueueRecipePhoto(id){
 if(hhRecipePhotos.has(id)||hhRecipePhotosInFlight.has(id))return;
 hhRecipePhotoQueue.add(id);
 if(hhRecipePhotoTimer)return;
 hhRecipePhotoTimer=setTimeout(()=>{
  hhRecipePhotoTimer=null;
  const ids=[...hhRecipePhotoQueue];hhRecipePhotoQueue.clear();
  if(ids.length)hhFetchRecipePhotos(ids).catch(err=>console.warn('Rezeptbilder konnten nicht geladen werden',err));

function hhObserveRecipePhotos(){
 hhRecipePhotoObserver?.disconnect();hhRecipePhotoObserver=null;
 const nodes=[...document.querySelectorAll('#recipe-cards [data-hh-recipe-image]')];
 if(!nodes.length)return;
 if(typeof IntersectionObserver==='undefined'){
  nodes.forEach(node=>hhQueueRecipePhoto(node.getAttribute('data-hh-recipe-image')));return;
 }
 hhRecipePhotoObserver=new IntersectionObserver(entries=>{
  for(const entry of entries)if(entry.isIntersecting){
   hhQueueRecipePhoto(entry.target.getAttribute('data-hh-recipe-image'));
   hhRecipePhotoObserver?.unobserve(entry.target);
  }
 },{rootMargin:'180px 0px'});
 nodes.forEach(n=>hhRecipePhotoObserver.observe(n));
}

async function randomWholeWeek(){
 const week=window.mealWeek||nextMealFriday(),days=Array.from({length:7},(_,i)=>shiftISO(week,i)),recipesAvailable=randomRecipeOptions();
 if(!recipesAvailable.length){toast(weekOnlyFavorites?'Bitte zuerst Hauptgerichte als Favoriten markieren':'Bitte zuerst Hauptgerichte markieren');return}
 const existing=(cache.mealPlan||[]).filter(m=>days.includes(m.meal_date));
 if(existing.length&&!await appConfirm('Die bisher geplanten Gerichte dieser Woche ersetzen?','Woche auslosen?'))return;
 const pool=orderedRecipesWithHistory(recipesAvailable,week);
 const choices=days.map((d,i)=>{let r=pool[i%pool.length],old=existing.find(m=>m.meal_date===d);return {date:d,recipe:r,old}});
 // Einträge einzeln aktualisieren, damit bestehende IDs und Portionsangaben erhalten bleiben.
 for(const x of choices){
   const payload={recipe_id:x.recipe.id,portions:x.old?.portions||x.recipe.portions||2,dessert:x.old?.dessert||null};
   const q=x.old?client.from('meal_plan').update(payload).eq('id',x.old.id).eq('household_id',household):client.from('meal_plan').insert({...payload,household_id:household,meal_date:x.date});
   const {error}=await q;if(error){toast('Auslosen teilweise fehlgeschlagen: '+error.message);await recipes('week');return}
 }
 toast('Woche ausgelost');window.mealWeek=week;recipes('week')
}
// V2.0.5: Auch frühere Planungen zählen zur Auswahl; es werden keine neuen Datenbanktabellen benötigt.
function mealHistoryWeeks(targetWeek,plan){
 return [...new Set((plan||[]).filter(x=>x.recipe_id&&x.meal_date<targetWeek).map(x=>fridayWeek(x.meal_date)))]
  .filter(w=>w<targetWeek).sort((a,b)=>b.localeCompare(a));
}
function orderedRecipesWithHistory(options,targetWeek){
 const today=localISO(),history=new Map();
 for(const m of cache.mealPlan||[]){
  // Keine künftigen Wochen oder die aktuell neu zu planende Woche als Historie auswerten.
  if(!m.recipe_id||m.meal_date>=targetWeek||m.meal_date>today)continue;
  let age=Math.floor((Date.parse(targetWeek+'T12:00:00Z')-Date.parse(m.meal_date+'T12:00:00Z'))/86400000);
  if(age<0)continue;
  let penalty=age<=7?100:age<=14?55:age<=28?25:age<=56?8:1;
  history.set(m.recipe_id,(history.get(m.recipe_id)||0)+penalty);
 }
 // Zufällige Reihenfolge innerhalb der gleichen Historien-Gewichtung.
 return [...options].map(r=>({r,score:(history.get(r.id)||0),tie:Math.random()}))
  .sort((a,b)=>a.score-b.score||a.tie-b.tie).map(x=>x.r);
}
async function repeatMealWeek(){
 const target=window.mealWeek||nextMealFriday(),select=document.getElementById('week-history-select'),source=select?.value;
 if(!source||source>=target){toast('Bitte eine frühere Woche auswählen');return}
 const original=(cache.mealPlan||[]).filter(m=>m.meal_date>=source&&m.meal_date<=shiftISO(source,6)&&m.recipe_id);
 if(!original.length){toast('In dieser Woche sind keine Gerichte gespeichert');return}
 const dest=(cache.mealPlan||[]).filter(m=>m.meal_date>=target&&m.meal_date<=shiftISO(target,6));
 const question=`${original.length} Gerichte aus der Woche ${formatDateDE(source)} übernehmen? ${dest.length?'Die '+dest.length+' bereits geplanten Tage werden dabei ersetzt.':'Die ausgewählte Woche wird gefüllt.'}`;
 if(!await appConfirm(question,'Woche wiederholen?'))return;
 const btn=document.querySelector('.week-history-controls button');if(btn)btn.disabled=true;
 let finished=0;
 for(let i=0;i<7;i++){
  let date=shiftISO(target,i),old=dest.find(m=>m.meal_date===date),previous=original.find(m=>m.meal_date===shiftISO(source,i));
  if(previous){
   const data={recipe_id:previous.recipe_id,portions:previous.portions||2,dessert:previous.dessert||null};
   const q=old?client.from('meal_plan').update(data).eq('id',old.id).eq('household_id',household):client.from('meal_plan').insert({...data,household_id:household,meal_date:date});
   const {error}=await q;
   if(error){toast('Übernahme nach '+finished+' Tagen unterbrochen: '+error.message);await recipes('week');return}
   finished++;
  }else if(old){
   const {error}=await client.from('meal_plan').delete().eq('id',old.id).eq('household_id',household);
   if(error){toast('Woche teilweise übernommen: '+error.message);await recipes('week');return}
  }
 }
 toast(finished+' Gerichte aus der früheren Woche übernommen');window.mealWeek=target;await recipes('week');
}

async function hhV23SaveRecipeShopping(e,id){

async function hhCalSave(e,id){
 e.preventDefault();const f=e.target.tagName==='FORM'?e.target:e.target.form,allDay=f.elements.namedItem('all_day').checked;
 let start,end;
 if(allDay){
  const sd=f.elements.namedItem('start_day').value,ed=f.elements.namedItem('end_day').value||sd;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(sd)||!/^\d{4}-\d{2}-\d{2}$/.test(ed)||ed<sd){toast('Bitte gültige Start- und Enddaten angeben');return}
  start=new Date(sd+'T00:00:00');end=new Date(shiftISO(ed,1)+'T00:00:00');
 }else{start=new Date(f.elements.namedItem('start').value);end=f.elements.namedItem('end').value?new Date(f.elements.namedItem('end').value):null;}
 if(!Number.isFinite(start.getTime())||(end&&!Number.isFinite(end.getTime()))){toast('Bitte gültige Termine angeben');return}
 if(end&&end<=start){toast('Das Ende muss nach dem Beginn liegen');return}
 const payload={title:f.elements.namedItem('title').value.trim(),starts_at:start.toISOString(),ends_at:end?end.toISOString():null,notes:f.elements.namedItem('notes').value.trim()||null,all_day:allDay,event_category:f.elements.namedItem('person').value};
 if(!payload.title){toast('Bitte einen Titel eingeben');return}
 const button=f.querySelector('button[type="submit"]');if(button)button.disabled=true;
 const result=id?await client.from('calendar_events').update(payload).eq('id',id).eq('household_id',household):await client.from('calendar_events').insert({household_id:household,...payload});
 if(result.error){toast('Speichern fehlgeschlagen: '+result.error.message);if(button)button.disabled=false;return}
 hhCalSelected=localISO(start);hhCalMonth=new Date(start.getFullYear(),start.getMonth(),1);
 toast(id?'Termin aktualisiert':'Termin gespeichert');await calendar();
}

async function importWasteCalendar(file){
 if(!file)return;
 let raw=await file.text(),blocks=raw.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1),entries=[];
 for(const b of blocks){let field=k=>{let line=b.split('\n').find(x=>x.startsWith(k+':')||x.startsWith(k+';'));return line?line.slice(line.indexOf(':')+1).trim():''};let name=field('SUMMARY'),date=field('DTSTART').slice(0,8),uid=field('UID');if(!/^(Restmüll|Bioabfall|Papier|Gelbe Tonne)/i.test(name)||!/^[0-9]{8}$/.test(date)||!uid)continue;let iso=date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8);entries.push({household_id:household,title:name,starts_at:iso+'T12:00:00Z',notes:'WBC-Abfallkalender · '+iso,apple_event_uid:'wbc-'+uid})}
 if(!entries.length){toast('Keine passenden Abfuhrtermine gefunden');return}
 let {data:existing,error:readError}=await client.from('calendar_events').select('apple_event_uid').eq('household_id',household).like('apple_event_uid','wbc-%');if(readError){toast(readError.message);return}
 let ids=new Set((existing||[]).map(x=>x.apple_event_uid)),fresh=entries.filter(x=>!ids.has(x.apple_event_uid));if(!fresh.length){toast('Alle Abfuhrtermine sind bereits vorhanden');return}
 let {error}=await client.from('calendar_events').insert(fresh);if(error){toast('Import fehlgeschlagen: '+error.message);return}toast(fresh.length+' Abfuhrtermine importiert');calendar()
}

function parseShoppingInput(raw){let text=raw.trim().replace(/\s+/g,' '),quantity=null,unit=null;const num='(\\d+(?:[.,]\\d+)?)',units='(kg|g|l|liter|ml|stück|stk\\.?|packungen?|pakete?|flaschen?|dosen?)';let re1=new RegExp('^'+num+'\\s*(?:x\\s*)?'+units+'\\s+(.+)$','i'),re2=new RegExp('^'+num+'\\s*x\\s+(.+)$','i'),re3=new RegExp('^(.+?)\\s+'+num+'\\s*'+units+'$','i');let m;if((m=text.match(re1))){quantity=Number(m[1].replace(',','.'));unit=m[2];text=m[3]}else if((m=text.match(re2))){quantity=Number(m[1].replace(',','.'));unit='Stück';text=m[2]}else if((m=text.match(re3))){quantity=Number(m[2].replace(',','.'));unit=m[3];text=m[1]}else if((m=text.match(new RegExp('^'+num+'\\s+(.+)$','i')))){quantity=Number(m[1].replace(',','.'));unit='Stück';text=m[2]}else if((m=text.match(new RegExp('^(.+?)\\s+'+num+'$','i')))){quantity=Number(m[2].replace(',','.'));unit='Stück';text=m[1]}if(unit){unit=unit.toLowerCase().replace(/^liter$/,'l').replace(/^stk\\.?$/,'Stück').replace(/^stück$/,'Stück')}return {name:text.trim(),quantity,unit}}

function fridayWeek(d){let date=new Date(d+'T12:00:00');let shift=(date.getDay()+2)%7;date.setDate(date.getDate()-shift);return date.toLocaleDateString('en-CA')}
function normalizedShopUnit(unit,quantity){
 const value=String(unit||'').trim().toLocaleLowerCase('de-DE');
 const amount=quantity==null?null:Number(quantity);
 if(value==='kg')return {unit:'g',quantity:amount==null?null:amount*1000};
 if(value==='g'||value==='gramm')return {unit:'g',quantity:amount};
 if(value==='l'||value==='liter')return {unit:'ml',quantity:amount==null?null:amount*1000};
 if(value==='ml')return {unit:'ml',quantity:amount};
 if(['stück','stk','stk.','st.'].includes(value))return {unit:'Stück',quantity:amount};
 return {unit:value,quantity:amount};
}
function shoppingCanonicalName(name){
 let s=String(name||'').replace(/\s*\*\s*$/,'').trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ');
 if(!s)return '';
 s=s.replace(/\brote[nmrs]?\s+paprika(schoten)?\b/g,'paprika');
 s=s.replace(/\bgelbe[nmrs]?\s+paprika(schoten)?\b/g,'paprika');
 s=s.replace(/\bgr[üu]ne[nmrs]?\s+paprika(schoten)?\b/g,'paprika');
 s=s.replace(/\borangene[nmrs]?\s+paprika(schoten)?\b/g,'paprika');
 s=s.replace(/\bpaprikaschoten\b/g,'paprika');
 s=s.replace(/\bpaprikas\b/g,'paprika');
 return s.trim();
}
function shoppingDisplayName(name){
 const key=shoppingCanonicalName(name);
 if(key==='paprika')return 'Paprika';
 return String(name||'').replace(/\s*\*\s*$/,'').trim();
}
function shoppingDefaultPieceUnit(name,unit,quantity){
 const raw=String(unit||'').trim();
 if(raw)return raw;
 const amount=quantity==null?null:Number(quantity);
 if(amount==null||!Number.isFinite(amount))return raw;
 const key=shoppingCanonicalName(name);
 if(['paprika','zwiebel','zwiebeln','gurke','gurken','zucchini','aubergine','auberginen','apfel','äpfel','banane','bananen','birne','birnen','zitrone','zitronen','limette','limetten','orange','orangen'].includes(key))return 'Stück';
 return raw;
}
function shoppingMergeInfo(name,unit,quantity){
 const preferredUnit=shoppingDefaultPieceUnit(name,unit,quantity);
 const normalized=normalizedShopUnit(preferredUnit,quantity);
 return {
  key:shoppingCanonicalName(name)+'|'+String(normalized.unit||'').toLocaleLowerCase('de-DE'),
  name:shoppingDisplayName(name),
  unit:normalized.unit||null,
  quantity:normalized.quantity
 };
}
function shoppingAggregateKey(name,unit,quantity){return shoppingMergeInfo(name,unit,quantity).key}
async function hhConsolidateShoppingItems(listId,listItems){
 const rows=(listItems||[]).filter(x=>x.list_id===listId);
 if(rows.length<2)return false;
 const groups=new Map();
 for(const item of rows){
  const info=shoppingMergeInfo(item.name,item.unit,item.quantity);
  if(!info.key)continue;
  const groupKey=(item.checked?'done':'open')+'|'+info.key;
  if(!groups.has(groupKey))groups.set(groupKey,{items:[],displayName:info.name,unit:info.unit,quantity:0,hasQuantity:false});
  const group=groups.get(groupKey);
  group.items.push(item);
  if(info.quantity!=null&&Number.isFinite(info.quantity)){group.quantity+=info.quantity;group.hasQuantity=true}
 }
 const updates=[],removeIds=[];
 for(const group of groups.values()){
  if(!group.items.length)continue;
  const master=group.items[0];
  const payload={name:group.displayName,unit:group.unit,quantity:group.hasQuantity?Math.round(group.quantity*100)/100:null};
  const sameName=String(master.name||'').trim()===String(payload.name||'').trim();
  const sameUnit=String(master.unit||'')===String(payload.unit||'');
  const sameQty=(master.quantity==null&&payload.quantity==null)||(Number(master.quantity)===Number(payload.quantity));
  if(!sameName||!sameUnit||!sameQty)updates.push({id:master.id,payload});
  if(group.items.length>1)removeIds.push(...group.items.slice(1).map(x=>x.id));
 }
 for(const entry of updates){
  const {error}=await client.from('shopping_items').update(entry.payload).eq('id',entry.id).eq('household_id',household);
  if(error){toast('Artikel konnten nicht zusammengeführt werden: '+error.message);return false}
 }
 if(removeIds.length){
  const {error}=await client.from('shopping_items').delete().in('id',removeIds).eq('household_id',household);
  if(error){toast('Doppelte Artikel konnten nicht entfernt werden: '+error.message);return false}
 }
 return updates.length>0||removeIds.length>0;
}
async function shoppingFromWeek(listId){
 const target=cache.shoppingLists?.find(x=>x.id===listId&&x.status==='active');
 if(!target){toast('Bitte zuerst eine aktive Einkaufsliste öffnen');return}
 const start=upcomingShoppingFriday(),end=shiftISO(start,6);
 const requests=await Promise.all([
  client.from('meal_plan').select('*').eq('household_id',household).gte('meal_date',start).lte('meal_date',end),
  client.from('recipes').select('*').eq('household_id',household),
  client.from('recipe_ingredients').select('*').eq('household_id',household),
  client.from('shopping_items').select('*').eq('household_id',household).eq('list_id',listId)
 ]);
 const error=requests.find(x=>x.error)?.error;
 if(error){toast('Zutaten konnten nicht geladen werden: '+error.message);return}
 const [plan,recipes,ingredients,existingItems]=requests.map(x=>x.data||[]);
 if(!plan.length){toast('Für '+formatDateDE(start)+' bis '+formatDateDE(end)+' sind keine Gerichte eingeplant.');return}
 const sums=new Map();let missing=0,excluded=0;
 for(const m of plan){
  const r=recipes.find(x=>x.id===m.recipe_id);
  if(!r){missing++;continue}
  const recipeIngredients=ingredients.filter(x=>x.recipe_id===r.id);
  if(!recipeIngredients.length){missing++;continue}
  for(const i of recipeIngredients){
   const name=normalizePantryIngredient(i.ingredient);
   if(!name)continue;
   if(isPantryExcluded(i.ingredient)){excluded++;continue}
   const scaled=i.quantity==null?null:Number(i.quantity)*Number(m.portions||r.portions||1)/Number(r.portions||1);
   const info=shoppingMergeInfo(i.ingredient,i.unit,scaled);
   const key=info.key;
   if(!sums.has(key))sums.set(key,{name:info.name,unit:info.unit||null,quantity:0,hasQuantity:false});
   const item=sums.get(key);
   if(info.quantity!=null&&Number.isFinite(info.quantity)){item.quantity+=info.quantity;item.hasQuantity=true}
  }
 }
 if(!sums.size){toast('Keine Einkaufszutaten vorhanden'+(excluded?' · Vorratszutaten ausgeschlossen':''));return}
 const existing=new Map(existingItems.filter(i=>!i.checked).map(i=>[shoppingMergeInfo(i.name,i.unit,i.quantity).key,i]));
 const additions=[],updates=[];let mergedExisting=0;
 for(const [key,x] of sums){
  const match=existing.get(key);
  if(match){
   const current=shoppingMergeInfo(match.name,match.unit,match.quantity);
   const nextQuantity=x.hasQuantity?Math.round((((current.quantity!=null&&Number.isFinite(current.quantity))?current.quantity:0)+x.quantity)*100)/100:(match.quantity??null);
   updates.push({id:match.id,payload:{name:x.name,unit:x.unit,quantity:x.hasQuantity?nextQuantity:null}});
   mergedExisting++;
   continue;
  }
  additions.push({household_id:household,list_id:listId,name:x.name,quantity:x.hasQuantity?Math.round(x.quantity*100)/100:null,unit:x.unit});
 }
 for(const entry of updates){
  const {error}=await client.from('shopping_items').update(entry.payload).eq('id',entry.id).eq('household_id',household);
  if(error){toast('Vorhandene Einkaufsartikel konnten nicht ergänzt werden: '+error.message);return}
 }
 if(additions.length){
  const {error:insertError}=await client.from('shopping_items').insert(additions);
  if(insertError){toast('Übernahme fehlgeschlagen: '+insertError.message);return}
 }
 if(!additions.length&&!updates.length){toast('Keine Einkaufszutaten vorhanden'+(excluded?' · Vorratszutaten ausgeschlossen':''));return}
 toast((additions.length?additions.length+' neue Artikel':'Keine neuen Artikel')+(mergedExisting?' · '+mergedExisting+' vorhandene ergänzt':'')+(missing?' · '+missing+' Rezepte ohne Zutaten':'')+(excluded?' · '+excluded+' Vorratszutaten übersprungen':''));
 activeShoppingId=listId;await shopping();
}

function hhDaysUntil(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return null;const [y,m,d]=iso.split('-').map(Number);const now=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}

 ]);
 if(page!=='reminders'||household!==h)return;
 if([tr,mr,ar,cr].some(r=>r.error)){render(back()+'<h2>🔔 Erinnerungen</h2><div class="notice error">Erinnerungen konnten nicht vollständig geladen werden. Bitte die Verbindung prüfen.</div><button onclick="reminders()">Erneut versuchen</button>');return}

 const pref=prefs.push_preferences||{};
 for(const t of tr.data||[]){const days=hhDaysUntil(t.due_date);if(days===null||days>30||pref.task_reminders===false)continue;entries.push({type:'task',title:t.title,detail:t.category==='hof'?'Hof & Reparaturen':'Haushalt',date:t.due_date,days,route:t.category==='hof'?'yard':'tasks'})}
 for(const m of mr.data||[]){if(pref.maintenance_reminders===false)break;const a=assetsById[m.asset_id],days=hhDaysUntil(m.due_date),km=m.due_odometer_km!=null&&a?.odometer_km!=null&&Number(a.odometer_km)>=Number(m.due_odometer_km),hours=m.due_operating_hours!=null&&a?.operating_hours!=null&&Number(a.operating_hours)>=Number(m.due_operating_hours);if(!(days!==null&&days<=30)&&!km&&!hours)continue;entries.push({type:'maintenance',title:m.title,detail:a?.name||'Fahrzeug/Maschine',date:m.due_date,days:km||hours?Math.min(days??0,0):days??0,route:'assets',assetId:a?.id})}

 }

// Fremde Haushalte und Benutzerkonten werden niemals importiert.
const HH_BACKUP_VERSION=1;
// Reihenfolge ist wichtig: referenzierte Eltern vor Kinddatensaetzen.
const HH_BACKUP_TABLES=[
 'recipes','assets','shopping_lists','tasks','ideas','calendar_events',
 'maintenance','recipe_ingredients','meal_plan','shopping_items',
 'task_completions','asset_expenses','maintenance_history'
];
// Diese Tabellen existieren nur in bestimmten Installationen.
const HH_BACKUP_OPTIONAL=['idea_photos','waste_calendar_imports','hh_shopping_list_settings','hh_shopping_item_categories'];
let hhBackupCandidate=null;
let hhBackupBusy=false;
function hhBackupPortablePayload(backup){const copy={...backup};delete copy.integrity_sha256;return JSON.stringify(copy);}
async function hhBackupDigest(backup){if(!globalThis.crypto?.subtle)throw new Error('Prüfsumme auf diesem Gerät nicht verfügbar');const data=new TextEncoder().encode(hhBackupPortablePayload(backup));const result=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(result),x=>x.toString(16).padStart(2,'0')).join('');}

function hhBackupStatus(message,problem=false){
 const el=document.getElementById('hh-backup-status');
 if(el){el.textContent=message;el.className=problem?'error':'muted';el.style.marginTop='12px';}
 if(problem)toast(message);
}
function hhBackupMissingTable(error){
 return ['42P01','PGRST205','PGRST116'].includes(String(error?.code||'')) && /not found|could not find|does not exist|schema cache/i.test(String(error?.message||''));
}
async function hhBackupReadTable(table,optional=false,columns="*"){
 // Supabase/PostgREST begrenzt oft auf 1000 Zeilen pro Anfrage.
 // Das feste ID-Sortierkriterium sorgt fuer reproduzierbare Seiten.
 const all=[];const step=500;
 for(let n=0;n<100000;n+=step){
  const {data,error}=await client.from(table).select(columns).eq('household_id',household).order('id',{ascending:true}).range(n,n+step-1);
  if(error){if(optional&&hhBackupMissingTable(error))return null;throw new Error(table+': '+error.message)}
  const page=data||[];all.push(...page);
  if(page.length<step)return all;
 }
 throw new Error(table+': Sicherheitsgrenze beim Lesen erreicht.');
}
async function hhBackupDownload(){
 if(!client||!user||!household){toast('Bitte zuerst anmelden');return;}
 if(hhBackupBusy||hhBackupRestoreActive){toast('Es läuft bereits eine Sicherung oder Wiederherstellung');return;}
 hhBackupBusy=true;
 const btn=document.getElementById('hh-backup-download');
 if(btn)btn.disabled=true;
 hhBackupStatus('Sicherungsdatei wird zusammengestellt …');
 try{
  const tables={},skipped=[];let total=0;
  for(const name of [...HH_BACKUP_TABLES,...HH_BACKUP_OPTIONAL]){
   hhBackupStatus('Lese '+name+' …');
   const rows=await hhBackupReadTable(name,HH_BACKUP_OPTIONAL.includes(name));
   if(rows===null){skipped.push(name);continue;}
   tables[name]=rows;total+=rows.length;
  }
  const {data:up,error:upError}=await client.from('user_preferences').select('*').eq('user_id',user.id).maybeSingle();
  if(upError)throw new Error('Benutzereinstellungen: '+upError.message);
  const backup={format:'haus-hof-backup',format_version:HH_BACKUP_VERSION,app_version:'2.3.2',created_at:new Date().toISOString(),household_id:household,created_by:user.id,tables,user_preferences:up||null,skipped_optional_tables:skipped};
  try{backup.integrity_sha256=await hhBackupDigest(backup);}catch(e){throw new Error('Sicherung nicht geprüft: '+e.message)}
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');link.href=url;
  link.download='Haus-und-Hof-Sicherung-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  hhBackupStatus('Sicherung mit SHA-256-Prüfsumme erstellt: '+total+' Datensätze. Bitte die Datei in „Dateien“ sichern.'+(skipped.length?' Nicht vorhandene optionale Tabellen: '+skipped.join(', ')+'.':''));
 }catch(e){hhBackupStatus('Sicherung nicht erstellt: '+(e?.message||e),true)}
 finally{hhBackupBusy=false;if(btn)btn.disabled=false;}
}
function hhBackupOpenRestore(){
 hhBackupCandidate=null;
 const element=document.createElement('div');element.id='hh-restore-panel';
 document.getElementById('hh-restore-panel')?.remove();
 element.className='card';
 element.innerHTML='<h3>Datensicherung einlesen</h3><p class="muted">Wähle eine von Haus & Hof erstellte JSON-Sicherungsdatei. Die App prüft zuerst den Haushalt und zeigt die enthaltenen Einträge. Noch wird nichts gespeichert.</p><input type="file" id="hh-backup-file" accept=".json,application/json" aria-label="Sicherungsdatei auswählen"><div id="hh-backup-preview" role="status" style="margin-top:12px"></div><div class="actions"><button class="secondary" onclick="hhBackupCloseRestore()">Abbrechen</button><button id="hh-backup-restore-button" disabled onclick="hhBackupRestore()">Fehlende Daten wiederherstellen</button></div>';
 const anchor=document.getElementById('hh-backup-status');
 (anchor?.parentElement||document.getElementById('app')).appendChild(element);
 element.querySelector('#hh-backup-file').addEventListener('change',hhBackupFileChanged);
}
function hhBackupCloseRestore(){hhBackupCandidate=null;document.getElementById('hh-restore-panel')?.remove()}
async function hhBackupFileChanged(event){
 hhBackupCandidate=null;
 const output=document.getElementById('hh-backup-preview'),button=document.getElementById('hh-backup-restore-button');
 if(button)button.disabled=true;
 const file=event.target.files?.[0];if(!file)return;
 try{
  if(file.size>80*1024*1024)throw new Error('Datei ist größer als 80 MB. Bitte eine kleinere Sicherungsdatei verwenden.');
  const backup=JSON.parse(await file.text());
  if(backup?.format!=='haus-hof-backup'||backup.format_version!==HH_BACKUP_VERSION)throw new Error('Diese Datei ist keine unterstützte Haus-&-Hof-Sicherung.');
  if(backup.integrity_sha256){const observed=await hhBackupDigest(backup);if(observed!==backup.integrity_sha256)throw new Error('Prüfsumme stimmt nicht: Die Datei wurde verändert oder ist beschädigt.');}
  if(!household||backup.household_id!==household)throw new Error('Die Sicherung gehört nicht zum angemeldeten Haushalt.');
  if(!backup.tables||typeof backup.tables!=='object'||Array.isArray(backup.tables))throw new Error('Die Tabellen fehlen in der Sicherung.');
  const entries=[];
  for(const [name,rows] of Object.entries(backup.tables)){
   if(![...HH_BACKUP_TABLES,...HH_BACKUP_OPTIONAL].includes(name)||!Array.isArray(rows))throw new Error('Ungültige Tabelle: '+name);
   if(rows.length>100000)throw new Error('Zu viele Datensätze in '+name);
   const seen=new Set();
   for(const row of rows){
    if(!row||typeof row!=='object'||Array.isArray(row)||row.household_id!==household||typeof row.id!=='string'||! /^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(row.id)||seen.has(row.id))throw new Error('Ungültiger Datensatz in '+name);
    seen.add(row.id);
   }
   entries.push([name,rows.length]);
  }
  for(const name of HH_BACKUP_TABLES)if(!Array.isArray(backup.tables[name]))throw new Error('Die erforderliche Tabelle '+name+' fehlt.');
  hhBackupCandidate=backup;
  if(output)output.innerHTML='<p><strong>'+entries.reduce((s,x)=>s+x[1],0)+' Datensätze</strong> in '+entries.length+' Tabellen.</p><p class="muted">'+entries.map(([n,v])=>esc(n)+': '+v).join(' · ')+'</p><p class="muted">Gesichert am '+esc(new Date(backup.created_at).toLocaleString('de-DE'))+'. Vorhandene IDs werden übersprungen. Diese Aktion löscht oder überschreibt nichts.</p><p class="muted">'+(backup.integrity_sha256?'✓ Prüfsumme überprüft.':'Ältere Sicherung ohne Prüfsumme: Inhalt nicht kryptografisch geprüft.')+'</p>';
  if(button)button.disabled=false;
 }catch(e){if(output)output.textContent='Datei nicht verwendbar: '+(e?.message||e);}
}
// Vor jeder Wiederherstellung alle Zieltabellen lesend pruefen.
// Dadurch scheitert eine nicht kompatible Datenbank, bevor Daten veraendert werden.
async function hhBackupPreflight(backup){
 const plan=[];
 for(const name of [...HH_BACKUP_TABLES,...HH_BACKUP_OPTIONAL]){
  const rows=backup.tables[name];if(!rows?.length)continue;
  const existing=await hhBackupReadTable(name,HH_BACKUP_OPTIONAL.includes(name),'id');
  if(existing===null)throw new Error('Zieltabelle fehlt: '+name);
  const ids=new Set(existing.map(x=>x.id));
  plan.push({name,missing:rows.filter(x=>!ids.has(x.id)),already:rows.filter(x=>ids.has(x.id)).length});
 }
 return plan;
}
async function hhBackupVerifyIds(name,ids){
 // Kleine Batches, damit nach Netzfehlern sicher erkennbar ist, was wirklich gespeichert wurde.
 const {data,error}=await client.from(name).select('id').eq('household_id',household).in('id',ids);
 if(error)throw new Error(name+': Kontrolle fehlgeschlagen: '+error.message);
 const found=new Set((data||[]).map(row=>row.id));
 return ids.filter(id=>!found.has(id));
}
async function hhBackupRestore(){
 const backup=hhBackupCandidate;
 if(!backup||!user||!household||backup.household_id!==household)return;
 if(hhBackupBusy||hhBackupRestoreActive){toast('Sicherung oder Wiederherstellung läuft bereits');return;}
 hhBackupRestoreActive=true;
 const button=document.getElementById('hh-backup-restore-button');if(button)button.disabled=true;
 let inserted=0,skipped=0;
 const view=document.getElementById('hh-backup-preview');
 try{
  if(view)view.textContent='Prüfe alle Zieltabellen vor dem Import …';
  const plan=await hhBackupPreflight(backup);
  const totalMissing=plan.reduce((n,item)=>n+item.missing.length,0);
  const totalExisting=plan.reduce((n,item)=>n+item.already,0);
  if(!totalMissing){if(view)view.textContent='Alle '+totalExisting+' Datensätze sind bereits vorhanden. Nichts zu ergänzen.';hhBackupStatus('Keine fehlenden Datensätze.');return;}
  if(view)view.textContent='Vorprüfung abgeschlossen: '+totalMissing+' fehlende Datensätze, '+totalExisting+' bereits vorhanden. Noch nichts verändert.';
  if(!await appConfirm('Vorprüfung erfolgreich: '+totalMissing+' fehlende Datensätze ergänzen? '+totalExisting+' sind schon vorhanden. Bestehende Einträge werden nicht überschrieben. Wichtig: Bei einem Netzfehler können bereits ergänzte Datensätze bestehen bleiben.','Datensicherung wiederherstellen?'))return;
  for(const group of plan){
   const {name,missing,already}=group;skipped+=already;
   for(let i=0;i<missing.length;i+=15){
    const chunk=missing.slice(i,i+15).map(row=>({...row,household_id:household}));
    if(view)view.textContent='Speichere '+name+' … ('+inserted+' ergänzt)';
    let {error}=await client.from(name).insert(chunk);
    if(error){
     // Nach einem Verbindungsproblem / parallelem Import nachsehen, ob IDs schon angelegt wurden.
     // Kein blindes Wiederholen: das koennte doppelte Eintraege erzeugen.
     const stillMissing=await hhBackupVerifyIds(name,chunk.map(row=>row.id));
     if(stillMissing.length)throw new Error(name+': '+error.message+' ('+stillMissing.length+' Datensätze fehlen noch)');
     skipped+=chunk.length;
    }else{
     const missingIds=await hhBackupVerifyIds(name,chunk.map(row=>row.id));
     if(missingIds.length)throw new Error(name+': '+missingIds.length+' Datensätze nach Speichern nicht sichtbar. Bitte vor Wiederholung prüfen.');
     inserted+=chunk.length;
    }
   }
  }
  if(view)view.textContent='Wiederherstellung abgeschlossen: '+inserted+' Datensätze ergänzt, '+skipped+' bereits vorhanden. Persönliche Einstellungen wurden nicht überschrieben.';
  hhBackupStatus('Wiederherstellung abgeschlossen.');
  hhBackupCandidate=null;
 }catch(e){
  if(view)view.textContent='Wiederherstellung angehalten: '+(e?.message||e)+'. Bisher bestätigt: '+inserted+' Datensätze ergänzt. Keine bestehenden Einträge gelöscht oder überschrieben. Bitte Ursache prüfen, bevor du erneut importierst.';
  hhBackupStatus('Wiederherstellung nicht vollständig.',true);
  if(button)button.disabled=false;
 }finally{
  hhBackupRestoreActive=false;
  hhLiveRequestRefresh();
 }
}

</script></body></html>
